function wireOptbar(){
  const byId=id=>document.getElementById(id);
  if(byId("opGutSize")) byId("opGutSize").onchange=e=>{ gutterDrawSize=e.target.value||null; };
  if(byId("opGutColor")) byId("opGutColor").onchange=e=>{ gutterDrawColor=e.target.value; byId("opGutSw").style.background=colorHex(e.target.value); };
  if(byId("opSnap")) byId("opSnap").onchange=e=>snap=e.target.checked;
  if(byId("opAuto")) byId("opAuto").onchange=e=>{ P.settings.autoMeasure=e.target.checked; setHint(e.target.checked?("Auto-measure on — each grid square = "+P.settings.feetPerSquare+" ft. Lengths fill in as you draw."):toolHint(tool)); };
  if(byId("opFps")) byId("opFps").onchange=e=>{ P.settings.feetPerSquare=Math.max(0.5,+e.target.value||1); refreshAll(); };
  if(byId("opCalib")) byId("opCalib").onclick=startCalibration;
  if(byId("opCustEdit")) byId("opCustEdit").onclick=()=>openCustomProduct(activeCustom);
  if(byId("opCustCol")) byId("opCustCol").onclick=()=>{ const p=(P.settings.customProducts||[]).find(x=>x.id===activeCustom); if(p) pickColor("Color for "+p.name,p.color,c=>{ p.color=c; if(byId("opCustSw"))byId("opCustSw").style.background=c; refreshAll(); }); };
  if(byId("opDsSize")) byId("opDsSize").onchange=e=>{ dsDrawSize=e.target.value; };
  if(byId("opDsColor")) byId("opDsColor").onchange=e=>{ dsDrawColor=e.target.value; byId("opDsSw").style.background=colorHex(e.target.value); };
  if(byId("opFont")) byId("opFont").onchange=e=>textFont=e.target.value;
  if(byId("opTSize")) byId("opTSize").onchange=e=>textSize=+e.target.value;
  if(byId("opTFill")) byId("opTFill").onclick=()=>pickColor("Box fill color",textFill,c=>{textFill=c;byId("opTFillSw").style.background=c;});
  if(byId("opTCol")) byId("opTCol").onclick=()=>pickColor("Text color",textColor,c=>{textColor=c;byId("opTColSw").style.background=c;});
  if(byId("opArrColor")) byId("opArrColor").oninput=e=>arrowColor=e.target.value;
  if(byId("opArrW")) byId("opArrW").oninput=e=>arrowWidth=+e.target.value;
  if(byId("opStamp")) byId("opStamp").onchange=e=>{ activeStamp=stampPresets[+e.target.value]; byId("opStampSw").style.background=activeStamp.color; };
  if(byId("opStampMgr")) byId("opStampMgr").onclick=openStampManager;
  if(byId("opHlColor")) byId("opHlColor").oninput=e=>hlColor=e.target.value;
  if(byId("opHlW")) byId("opHlW").oninput=e=>hlWidth=+e.target.value;
  if(byId("opDelete")) byId("opDelete").onclick=deleteSelected;
  if(byId("opDupe")) byId("opDupe").onclick=duplicateSelected;
  const selOne=()=> sel.size===1?objById([...sel][0]):null;
  if(byId("opSelDsColor")) byId("opSelDsColor").onchange=e=>{ const o=selOne(); if(o){ recordHistory(); o.color=e.target.value||null; if(byId("opSelSw"))byId("opSelSw").style.background=colorHex(o.color||P.settings.downspoutColor); refreshAll(); } };
  if(byId("opSelDsSize")) byId("opSelDsSize").onchange=e=>{ const o=selOne(); if(o){ recordHistory(); o.size=e.target.value; refreshAll(); } };
  if(byId("opSelGutColor")) byId("opSelGutColor").onchange=e=>{ const o=selOne(); if(o){ recordHistory(); o.color=e.target.value||null; if(byId("opSelSw"))byId("opSelSw").style.background=colorHex(o.color||P.settings.gutterColor); refreshAll(); } };
  if(byId("opSelGutSize")) byId("opSelGutSize").onchange=e=>{ const o=selOne(); if(o){ recordHistory(); o.size=e.target.value||null; refreshAll(); } };
  if(byId("opSelCap0")) byId("opSelCap0").onchange=e=>{ const o=selOne(); if(o){ recordHistory(); o.caps=o.caps||[true,true]; o.caps[0]=e.target.checked; refreshAll(); } };
  if(byId("opSelCap1")) byId("opSelCap1").onchange=e=>{ const o=selOne(); if(o){ recordHistory(); o.caps=o.caps||[true,true]; o.caps[1]=e.target.checked; refreshAll(); } };
  if(byId("opSelStampCol")) byId("opSelStampCol").onclick=()=>{ const o=selOne(); if(o) pickColor("Stamp color",o.color,c=>{ recordHistory(); o.color=c; if(byId("opSelSw"))byId("opSelSw").style.background=c; refreshAll(); }); };
}
/* current draw params */
let gutterDrawSize=null, gutterDrawColor=null, dsDrawSize=null, dsDrawColor=null;
let textFont="Arial", textSize=14, textFill="#ffffff", textColor="#1b2530";
let arrowColor="#c8202a", arrowWidth=3;

/* ============================================================ */
/* SNAP                                                         */
/* ============================================================ */
function snapW(p){
  if(!snap) return p;
  return {x:Math.round(p.x/(GRID/1))*(GRID/1), y:Math.round(p.y/(GRID/1))*(GRID/1)};
}

/* ============================================================ */
/* HISTORY (undo / redo)                                        */
/* ============================================================ */
let history=[], hidx=-1, _histPending=false;
function snapshot(){ return JSON.parse(JSON.stringify({objects:P.objects,settings:P.settings,meta:P.meta,photos:P.photos,nextId})); }
function recordHistory(){
  // capture the state AFTER the current synchronous mutation completes,
  // so both undo and redo land on correct committed states regardless of
  // whether the caller records before or after it mutates.
  if(_histPending) return;
  _histPending=true;
  const flush=()=>{
    _histPending=false;
    history=history.slice(0,hidx+1);
    history.push(snapshot());
    if(history.length>80) history.shift();
    hidx=history.length-1;
    updateUndoButtons();
  };
  if(typeof queueMicrotask==="function") queueMicrotask(flush);
  else Promise.resolve().then(flush);
}
function updateUndoButtons(){
  const ids=["photoUndo","diagUndo"], rids=["photoRedo","diagRedo"];
  ids.forEach(id=>{ const u=document.getElementById(id); if(u) u.disabled=hidx<=0; });
  rids.forEach(id=>{ const r=document.getElementById(id); if(r) r.disabled=hidx>=history.length-1; });
}
function restore(s){
  P.objects=JSON.parse(JSON.stringify(s.objects));P.settings=JSON.parse(JSON.stringify(s.settings));
  P.meta=JSON.parse(JSON.stringify(s.meta));
  if(s.photos) P.photos=JSON.parse(JSON.stringify(s.photos));
  nextId=s.nextId; sel.clear();
  if(typeof photoSelMarks!=="undefined" && photoSelMarks) photoSelMarks.clear();
  refreshAll();
  if(curPage==="photos"){ if(typeof cancelPhotoLine==="function") cancelPhotoLine(); renderPhotos(); }
  updateUndoButtons();
}
function undo(){ if(hidx>0){hidx--;restore(history[hidx]);} }
function redo(){ if(hidx<history.length-1){hidx++;restore(history[hidx]);} }

/* ============================================================ */
/* HIT TESTING                                                  */
/* ============================================================ */
const EDITABLE=new Set(["seglen","dsnote","text","stamp"]);
function hitTest(pt){
  // 1) editable / object label boxes (topmost last drawn -> iterate reverse)
  for(let i=labelBoxes.length-1;i>=0;i--){
    const b=labelBoxes[i];
    if(pt.x>=b.x&&pt.x<=b.x+b.w&&pt.y>=b.y&&pt.y<=b.y+b.h){
      return {objId:b.objId,kind:b.kind,seg:b.seg,box:b};
    }
  }
  // 2) geometry, topmost first
  const ordered=[...P.objects].reverse();
  for(const o of ordered){
    if(o.t==="gutter"){
      const ps=o.pts.map(worldToScreen);
      for(let i=0;i<ps.length-1;i++){ if(ptSegDist(pt,ps[i],ps[i+1])<8) return {objId:o.id,kind:"gutterline",seg:i}; }
    } else if(o.t==="custom"){
      const ps=o.pts.map(worldToScreen);
      for(let i=0;i<ps.length-1;i++){ if(ptSegDist(pt,ps[i],ps[i+1])<8) return {objId:o.id,kind:"customline",seg:i}; }
    } else if(o.t==="arrow"){
      const a=worldToScreen({x:o.x1,y:o.y1}),b=worldToScreen({x:o.x2,y:o.y2});
      if(ptSegDist(pt,a,b)<8) return {objId:o.id,kind:"arrowline"};
    } else if(o.t==="hl"){
      const ps=o.pts.map(worldToScreen);
      for(let i=0;i<ps.length-1;i++){ if(ptSegDist(pt,ps[i],ps[i+1])<(o.width||16)*cam.scale/2+4) return {objId:o.id,kind:"hlline"}; }
    }
  }
  return null;
}
/* arrow endpoint handle hit when single-selected */
function arrowHandleHit(pt){
  if(sel.size!==1) return null;
  const o=objById([...sel][0]); if(!o||o.t!=="arrow") return null;
  const a=worldToScreen({x:o.x1,y:o.y1}),b=worldToScreen({x:o.x2,y:o.y2});
  if(Math.hypot(pt.x-a.x,pt.y-a.y)<8) return {o,end:0};
  if(Math.hypot(pt.x-b.x,pt.y-b.y)<8) return {o,end:1};
  return null;
}
/* vertex handle of a selected gutter/custom run */
function gutterVertexHit(pt){
  const ids=activeRunIds(); if(ids.size!==1) return null;
  const o=objById([...ids][0]); if(!o||(o.t!=="gutter"&&o.t!=="custom")||!o.pts) return null;
  for(let i=0;i<o.pts.length;i++){
    const s=worldToScreen(o.pts[i]);
    if(Math.hypot(pt.x-s.x,pt.y-s.y)<11) return {o,idx:i};
  }
  return null;
}
// when a shared corner vertex moves, drag any other run's coincident endpoint with it
function moveWeldedVertices(run, oldP, newP){
  for(const o of P.objects){
    if(o===run) continue;
    if((o.t==="gutter"||o.t==="custom")&&o.pts&&o.pts.length){
      const L=o.pts.length-1;
      if(dist(o.pts[0],oldP)<CAP_EPS){ o.pts[0]={x:newP.x,y:newP.y}; if(P.settings.autoMeasure&&o.pts.length>1) o.lengths[0]=autoLen(o.pts[0],o.pts[1]); }
      if(L>0 && dist(o.pts[L],oldP)<CAP_EPS){ o.pts[L]={x:newP.x,y:newP.y}; if(P.settings.autoMeasure&&o.pts.length>1) o.lengths[L-1]=autoLen(o.pts[L-1],o.pts[L]); }
    }
  }
}
/* text resize handle (bottom-right) */
function textHandleHit(pt){
  if(sel.size!==1) return null;
  const o=objById([...sel][0]); if(!o||o.t!=="text") return null;
  const br=worldToScreen({x:o.x+o.w,y:o.y+o.h});
  if(Math.hypot(pt.x-br.x,pt.y-br.y)<9) return o;
  return null;
}

/* ============================================================ */
/* MOVE / TRANSLATE                                             */
/* ============================================================ */
function translateInto(o,clone,dx,dy){
  if(o.t==="gutter"||o.t==="hl"||o.t==="custom"){ o.pts=clone.pts.map(p=>({x:p.x+dx,y:p.y+dy})); }
  else if(o.t==="arrow"){ o.x1=clone.x1+dx;o.y1=clone.y1+dy;o.x2=clone.x2+dx;o.y2=clone.y2+dy; }
  else { o.x=clone.x+dx;o.y=clone.y+dy; }
}

/* ============================================================ */
/* POINTER EVENTS                                               */
/* ============================================================ */
let press=null, panning=null, spaceDown=false, arrowDrag=null, textResize=null, vertexDrag=null;
let calib=null;   // {a, b} during scale calibration
let lastClickT=0, lastClickPt=null;
const activePointers=new Map();   // pointerId -> {x,y} (client coords) for multitouch
let gesture=null;                 // two-finger pan/zoom in progress
let drawDownPt=null;              // screen point where a gutter/custom stroke began (touch drag-to-draw)
let pendingTap=null;              // deferred ds/valley/stamp placement on touch (so a pinch doesn't drop one)

canvas.addEventListener("pointerdown",onDown);
window.addEventListener("pointermove",onMove);
window.addEventListener("pointerup",onUp);
window.addEventListener("pointercancel",onUp);
canvas.addEventListener("dblclick",onDbl);
canvas.addEventListener("wheel",onWheel,{passive:false});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

function gestCenter(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
function gestDist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y)||1; }
// abort any single-finger interaction when a 2nd finger lands (make way for pan/zoom)
function abortSingleTouch(){
  drawing=null; gutterExtend=null;
  press=null; arrowDrag=null; textResize=null; vertexDrag=null; marquee=null; pendingTap=null;
  panning=null;
  setHint(toolHint(tool)); draw();
}
function applyGesture(){
  if(!gesture || activePointers.size<2) return;
  const pts=[...activePointers.values()];
  const a=pts[0], b=pts[1];
  const r=canvas.getBoundingClientRect();
  const sx=r.width?(view.w/r.width):1, sy=r.height?(view.h/r.height):1;
  const cNow=gestCenter(a,b), dNow=gestDist(a,b);
  // world point that was under the start centroid
  const startCx=(gesture.startCenter.x-r.left)*sx, startCy=(gesture.startCenter.y-r.top)*sy;
  const worldX=startCx/gesture.startScale+gesture.startCamX;
  const worldY=startCy/gesture.startScale+gesture.startCamY;
  let scale=gesture.startScale*(dNow/gesture.startDist);
  scale=Math.max(.12,Math.min(7,scale));
  const nowCx=(cNow.x-r.left)*sx, nowCy=(cNow.y-r.top)*sy;
  cam.scale=scale;
  cam.x=worldX-nowCx/scale;
  cam.y=worldY-nowCy/scale;
  updateZoomLabel(); draw();
}

function onDown(e){
  if(e.pointerType==="touch"){
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(activePointers.size===2){
      // second finger: start two-finger pan/zoom, abort any single-finger action
      abortSingleTouch();
      const pts=[...activePointers.values()];
      gesture={startCenter:gestCenter(pts[0],pts[1]),startDist:gestDist(pts[0],pts[1]),
               startScale:cam.scale,startCamX:cam.x,startCamY:cam.y};
      draw(); return;
    }
    if(activePointers.size>2) return;
  }
  if(gesture) return;
  if(calib){
    if(e.button!==0) return;
    const w=snapW(screenToWorld(evtPos(e)));
    if(!calib.a){ calib.a=w; setHint("Now click the OTHER end of that wall."); draw(); }
    else {
      calib.b=w;
      const worldDist=dist(calib.a,calib.b);
      draw();
      if(worldDist<3){ calib=null; setHint(toolHint(tool)); return; }
      const ans=prompt("How many feet is that line in real life?","");
      if(ans!=null && +ans>0){
        const squares=worldDist/GRID;
        P.settings.feetPerSquare=Math.round((+ans/squares)*100)/100;
        P.settings.autoMeasure=true;
        setHint("Scale set: 1 grid square ≈ "+P.settings.feetPerSquare+" ft. Auto-measure is ON.");
      } else { setHint(toolHint(tool)); }
      calib=null; buildOptbar(); draw();
    }
    return;
  }
  if(e.button===1||((tool==="hand"||spaceDown)&&e.button===0)){
    panning={x:e.clientX,y:e.clientY,camx:cam.x,camy:cam.y};
    canvas.setPointerCapture(e.pointerId); canvas.style.cursor="grabbing"; return;
  }
  if(e.button!==0) return;
  commitEditor();
  const pt=evtPos(e); const w=screenToWorld(pt);
  cursorW=snapW(w);
  drawDownPt=pt;
  canvas.setPointerCapture(e.pointerId);

  if(tool==="select"){
    // handles first
    const ah=arrowHandleHit(pt); if(ah){ arrowDrag={o:ah.o,end:ah.end}; return; }
    const th=textHandleHit(pt); if(th){ textResize={o:th,w0:th.w,h0:th.h,pt}; return; }
    const gv=gutterVertexHit(pt); if(gv){ vertexDrag={o:gv.o,idx:gv.idx,oldPos:{x:gv.o.pts[gv.idx].x,y:gv.o.pts[gv.idx].y}}; return; }
    const hit=hitTest(pt);
    if(hit){
      // dragging a measurement label repositions just the label, not the object
      if(hit.kind==="seglen" || hit.kind==="dsnote"){
        const o=objById(hit.objId);
        let startOff={x:0,y:0};
        if(o){ const cur=(hit.kind==="dsnote")?(o.noteOff):(o.segLabelOff&&o.segLabelOff[hit.seg]); if(cur) startOff={x:cur.x||0,y:cur.y||0}; }
        press={pt,mode:"moveLabel",hit,startOff,moved:false};
        draw(); return;
      }
      // capture clones so a drag moves the hit run (and anything already selected)
      const moveIds=new Set(sel); moveIds.add(hit.objId);
      const clones={}; moveIds.forEach(id=>{ const ob=objById(id); if(ob) clones[id]=JSON.parse(JSON.stringify(ob)); });
      press={pt,mode:"maybeMove",hit,clones,moved:false};
    }else{
      if(!e.shiftKey){ sel.clear(); segSel.clear(); }
      press={pt,mode:"marquee",moved:false};
      marquee={x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y};
    }
    draw(); refreshSelInfo(); return;
  }
  if(tool==="gutter"){
    if(!drawing){
      // start a fresh run, or extend an existing run if we grabbed one of its open ends
      const hit=findGutterEndNear(w);
      if(hit){
        drawing={t:"gutter",pts:[{x:hit.pt.x,y:hit.pt.y}]};
        gutterExtend={runId:hit.o.id, end:hit.end};
        setHint("Extending run — click the next corner; double-click or Enter to finish.");
      } else {
        drawing={t:"gutter",pts:[snapW(w)]};
        gutterExtend=null;
      }
    } else {
      // snap onto an existing gutter end (forms a clean corner / closes a loop), else grid
      const hit=findGutterEndNear(w);
      drawing.pts.push(hit ? {x:hit.pt.x,y:hit.pt.y} : snapW(w));
    }
    draw(); return;
  }
  if(tool==="custom"){
    if(!drawing){ drawing={t:"custom",pts:[snapW(w)]}; }
    else { drawing.pts.push(snapW(w)); }
    draw(); return;
  }
  if(tool==="ds"||tool==="valley"||tool==="stamp"){
    if(e.pointerType==="touch"){ pendingTap={tool, w:{x:cursorW.x,y:cursorW.y}, downPt:pt}; return; }
    placeTapObject(tool, cursorW); return;
  }
  if(tool==="arrow"){ drawing={t:"arrow",start:w}; return; }
  if(tool==="text"){ drawing={t:"text",start:w}; return; }
  if(tool==="hl"){ drawing={t:"hl",pts:[w]}; return; }
}
function placeTapObject(which, w){
  recordHistory();
  if(which==="ds"){
    const o={t:"ds",id:uid(),x:w.x,y:w.y,notation:"",size:(dsDrawSize||P.settings.defaultDownspoutSize),color:(dsDrawColor||null)};
    P.objects.push(o); sel=new Set([o.id]); refreshAll();
    setTimeout(()=>openEditorFor({objId:o.id,kind:"dsnote"}),0);
  } else if(which==="valley"){
    const o={t:"valley",id:uid(),x:w.x,y:w.y};
    P.objects.push(o); sel=new Set([o.id]); refreshAll();
  } else if(which==="stamp"){
    const o={t:"stamp",id:uid(),x:w.x,y:w.y,text:activeStamp.text,color:activeStamp.color,font:P.settings.defaultFont};
    P.objects.push(o); sel=new Set([o.id]); refreshAll();
  }
}

function onMove(e){
  if(e.pointerType==="touch" && activePointers.has(e.pointerId)){
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  }
  if(gesture){ if(activePointers.size>=2) applyGesture(); return; }
  const pt=evtPos(e); const w=screenToWorld(pt);
  if(panning){
    cam.x=panning.camx-(e.clientX-panning.x)/cam.scale;
    cam.y=panning.camy-(e.clientY-panning.y)/cam.scale;
    draw(); return;
  }
  // hover cursor for drawing tools
  if(["gutter","custom","ds","valley","stamp","arrow","text","hl"].includes(tool)){ cursorW=snapW(w); }

  if(arrowDrag){ const o=arrowDrag.o; if(arrowDrag.end===0){o.x1=w.x;o.y1=w.y;}else{o.x2=w.x;o.y2=w.y;} draw(); return; }
  if(vertexDrag){
    const o=vertexDrag.o, idx=vertexDrag.idx;
    const np=snapW(w);
    const oldP={x:o.pts[idx].x,y:o.pts[idx].y};
    moveWeldedVertices(o, oldP, np);   // keep connected corners attached
    o.pts[idx]={x:np.x,y:np.y};
    if(P.settings.autoMeasure && o.lengths){
      if(idx>0) o.lengths[idx-1]=autoLen(o.pts[idx-1],o.pts[idx]);
      if(idx<o.pts.length-1) o.lengths[idx]=autoLen(o.pts[idx],o.pts[idx+1]);
    }
    draw(); return;
  }
  if(textResize){ const o=textResize.o; o.w=Math.max(60,textResize.w0+(pt.x-textResize.pt.x)/cam.scale); draw(); return; }

  if(press){
    const dx=pt.x-press.pt.x, dy=pt.y-press.pt.y;
    if(!press.moved && Math.hypot(dx,dy)>4) press.moved=true;
    if(press.mode==="maybeMove" && press.moved){
      const wdx=dx/cam.scale, wdy=dy/cam.scale;
      sel.forEach(id=>{ const o=objById(id); if(o&&press.clones[id]) translateInto(o,press.clones[id],wdx,wdy); });
      draw();
    } else if(press.mode==="moveLabel" && press.moved){
      const wdx=dx/cam.scale, wdy=dy/cam.scale;
      const o=objById(press.hit.objId);
      if(o){
        const nx=press.startOff.x+wdx, ny=press.startOff.y+wdy;
        if(press.hit.kind==="dsnote"){ o.noteOff={x:nx,y:ny}; }
        else { o.segLabelOff=o.segLabelOff||{}; o.segLabelOff[press.hit.seg]={x:nx,y:ny}; }
      }
      draw();
    } else if(press.mode==="marquee"){
      marquee.x1=pt.x;marquee.y1=pt.y; draw();
    }
    return;
  }

  if(drawing){
    if(drawing.t==="hl"){ drawing.pts.push(w); }
    draw(); return;
  }
  if(tool==="gutter"&&drawing){ draw(); }
  if(["gutter","custom","ds","valley","stamp"].includes(tool)) draw(); // show snapped cursor
}

function onUp(e){
  if(e.pointerType==="touch"){
    activePointers.delete(e.pointerId);
    if(gesture){
      if(activePointers.size<2) gesture=null;   // wait for remaining finger to lift before drawing
      return;
    }
    if(pendingTap){
      const upPt=evtPos(e);
      const moved=Math.hypot(upPt.x-pendingTap.downPt.x, upPt.y-pendingTap.downPt.y);
      if(moved<10) placeTapObject(pendingTap.tool, pendingTap.w);
      pendingTap=null; return;
    }
  }
  if(panning){ panning=null; canvas.style.cursor=(tool==="hand"?"grab":(tool==="select"?"default":"crosshair")); return; }
  if(arrowDrag){ arrowDrag=null; recordHistory(); return; }
  if(vertexDrag){ vertexDrag=null; recordHistory(); refreshAll(); return; }
  if(textResize){ textResize=null; recordHistory(); return; }

  if(press){
    if(press.mode==="maybeMove"){
      if(!press.moved){
        // click: edit label, select a single segment, or select an object
        if(press.hit && EDITABLE.has(press.hit.kind)){ openEditorFor(press.hit); }
        else if(press.hit && (press.hit.kind==="gutterline"||press.hit.kind==="customline") && press.hit.seg!=null){
          if(!e.shiftKey){ sel.clear(); segSel.clear(); }
          const k=segKey(press.hit.objId,press.hit.seg);
          if(e.shiftKey && segSel.has(k)) segSel.delete(k); else segSel.add(k);
          setHint("Segment selected (red). Box-drag over segments to pick more • drag a run to move it • Delete removes the selected segments.");
        }
        else if(press.hit){
          if(!e.shiftKey){ sel.clear(); segSel.clear(); }
          if(e.shiftKey && sel.has(press.hit.objId)) sel.delete(press.hit.objId); else sel.add(press.hit.objId);
        }
      } else { recordHistory(); }
    } else if(press.mode==="moveLabel"){
      if(!press.moved){ if(press.hit && EDITABLE.has(press.hit.kind)) openEditorFor(press.hit); }
      else { recordHistory(); }
    } else if(press.mode==="marquee"){
      selectInMarquee(marquee); marquee=null;
      if(segSel.size) setHint(segSel.size+" segment"+(segSel.size>1?"s":"")+" selected — Delete removes "+(segSel.size>1?"them":"it")+". Box-drag a whole run to select all of it.");
    }
    press=null; draw(); refreshSelInfo(); return;
  }

  // touch: a gutter/custom stroke is one drag — lift the finger to finish the run
  if(drawing && (drawing.t==="gutter"||drawing.t==="custom") && e.pointerType==="touch"){
    const upPt=evtPos(e);
    const moved = drawDownPt ? Math.hypot(upPt.x-drawDownPt.x, upPt.y-drawDownPt.y) : 0;
    if(moved>10){
      const w=screenToWorld(upPt);
      if(drawing.t==="gutter"){ const hit=findGutterEndNear(w); drawing.pts.push(hit?{x:hit.pt.x,y:hit.pt.y}:snapW(w)); finishGutter(); }
      else { drawing.pts.push(snapW(w)); finishCustom(); }
    } else { cancelDrawing(); }   // a tap that didn't drag = nothing placed
    updateDrawBar(); return;
  }

  if(drawing){
    const w=screenToWorld(evtPos(e));
    if(drawing.t==="arrow"){
      if(dist(drawing.start,w)>5){ recordHistory();
        const o={t:"arrow",id:uid(),x1:drawing.start.x,y1:drawing.start.y,x2:w.x,y2:w.y,color:arrowColor,width:arrowWidth};
        P.objects.push(o); sel=new Set([o.id]); refreshAll(); }
      drawing=null;
    } else if(drawing.t==="text"){
      const x=Math.min(drawing.start.x,w.x),y=Math.min(drawing.start.y,w.y);
      const ww=Math.max(60,Math.abs(w.x-drawing.start.x)),hh=Math.max(30,Math.abs(w.y-drawing.start.y));
      recordHistory();
      const o={t:"text",id:uid(),x,y,w:ww,h:hh,text:"",fill:textFill,color:textColor,font:textFont,size:textSize,stroke:"#c2cbd4"};
      P.objects.push(o); sel=new Set([o.id]); refreshAll();
      setTimeout(()=>openEditorFor({objId:o.id,kind:"text"}),0);
      drawing=null;
    } else if(drawing.t==="hl"){
      if(drawing.pts.length>1){ recordHistory();
        const o={t:"hl",id:uid(),pts:drawing.pts.slice(),color:hlColor,width:hlWidth};
        P.objects.push(o); refreshAll(); }
      drawing=null;
    }
    draw();
  }
}

function onDbl(e){
  if(drawing&&drawing.t==="gutter"){ finishGutter(); }
  else if(drawing&&drawing.t==="custom"){ finishCustom(); }
}

function finishGutter(){
  if(!(drawing&&drawing.t==="gutter")) return;
  if(drawing.pts.length<2){ drawing=null; gutterExtend=null; draw(); return; }
  const auto=P.settings.autoMeasure;

  if(gutterExtend){
    // merge the new points into the existing run (shared endpoint = drawing.pts[0])
    const R=objById(gutterExtend.runId);
    if(R){
      recordHistory();
      R.lengths=R.lengths||new Array(Math.max(0,R.pts.length-1)).fill("");
      const add=drawing.pts.slice(1);   // new vertices beyond the shared end
      let firstNewSeg;
      if(gutterExtend.end===1){
        // append: R.pts[last] == drawing.pts[0]
        const startIdx=R.pts.length-1;
        for(const p of add) R.pts.push(p);
        const newLens=[];
        for(let i=startIdx;i<R.pts.length-1;i++){ newLens.push(auto?autoLen(R.pts[i],R.pts[i+1]):""); }
        firstNewSeg=R.lengths.length;
        R.lengths=R.lengths.concat(newLens);
      } else {
        // prepend at start: R.pts[0] == drawing.pts[0]; new points extend outward, so reverse them in front
        const front=add.slice().reverse();           // e.g. [b,a] for drawing [S,a,b]
        R.pts=front.concat(R.pts);                    // [b,a,S,...]
        const newLens=[];
        for(let i=0;i<front.length;i++){ newLens.push(auto?autoLen(R.pts[i],R.pts[i+1]):""); }
        R.lengths=newLens.concat(R.lengths);
        firstNewSeg=0;
      }
      sel=new Set([R.id]); drawing=null; const wasAuto=auto; const rid=R.id; gutterExtend=null; refreshAll();
      if(!wasAuto){ setTimeout(()=>openSeg(rid,firstNewSeg),30); }
      return;
    }
    gutterExtend=null;
  }

  // brand-new run
  recordHistory();
  const pts=drawing.pts.slice();
  let lengths=new Array(pts.length-1).fill("");
  if(auto){ for(let i=0;i<pts.length-1;i++){ lengths[i]=autoLen(pts[i],pts[i+1]); } }
  const o={t:"gutter",id:uid(),pts,lengths,size:gutterDrawSize,color:gutterDrawColor,caps:[true,true]};
  P.objects.push(o); sel=new Set([o.id]); drawing=null; refreshAll();
  if(!auto){ setTimeout(()=>openSeg(o.id,0),30); }
}
function cancelDrawing(){ if(drawing){drawing=null;gutterExtend=null;draw();} }

function finishCustom(){
  if(!(drawing&&drawing.t==="custom")) return;
  if(drawing.pts.length<2){ drawing=null; draw(); return; }
  recordHistory();
  const pts=drawing.pts.slice();
  const auto=P.settings.autoMeasure;
  let lengths=new Array(pts.length-1).fill("");
  if(auto){ for(let i=0;i<pts.length-1;i++) lengths[i]=autoLen(pts[i],pts[i+1]); }
  const p=(P.settings.customProducts||[]).find(x=>x.id===activeCustom);
  const o={t:"custom",id:uid(),productId:activeCustom,pts,lengths,color:(p?p.color:null)};
  P.objects.push(o); sel=new Set([o.id]); drawing=null; refreshAll();
  if(!auto){ setTimeout(()=>openSeg(o.id,0),30); }
}

function onWheel(e){

function selectInMarquee(m){
  const r={x0:Math.min(m.x0,m.x1),y0:Math.min(m.y0,m.y1),x1:Math.max(m.x0,m.x1),y1:Math.max(m.y0,m.y1)};
  for(const o of P.objects){
    if((o.t==="gutter"||o.t==="custom")&&o.pts){
      const ps=o.pts.map(worldToScreen);
      for(let i=0;i<ps.length-1;i++){ if(segIntersectsRect(ps[i],ps[i+1],r)) segSel.add(segKey(o.id,i)); }
    } else {
      const b=objBounds(o);
      const tl=worldToScreen({x:b.x,y:b.y}), br=worldToScreen({x:b.x+b.w,y:b.y+b.h});
      if(tl.x<r.x1&&br.x>r.x0&&tl.y<r.y1&&br.y>r.y0) sel.add(o.id);
    }
  }
  refreshSelInfo();
}

function deleteSelected(){
  if(segSel.size===0 && sel.size===0) return;
  recordHistory();
  if(segSel.size) deleteSegments(segSel);
  if(sel.size) P.objects=P.objects.filter(o=>!sel.has(o.id));
  sel.clear(); segSel.clear(); refreshAll();
}
/* remove a set of segment keys; each run is rebuilt from its remaining contiguous segments
   (so removing a middle segment splits the run; removing all of them deletes the run) */
function deleteSegments(keys){
  const byObj=new Map();
  keys.forEach(k=>{ const {objId,seg}=parseSegKey(k); if(!byObj.has(objId)) byObj.set(objId,new Set()); byObj.get(objId).add(seg); });
  for(const [objId,rem] of byObj){
    const o=objById(objId); if(!o||!o.pts) continue;
    const n=o.pts.length-1, caps=o.caps||[true,true];
    const kept=[]; for(let i=0;i<n;i++){ if(!rem.has(i)) kept.push(i); }
    if(kept.length===0){ P.objects=P.objects.filter(x=>x.id!==o.id); continue; }
    // contiguous groups of kept segment indices
    const groups=[]; let cur=[kept[0]];
    for(let j=1;j<kept.length;j++){ if(kept[j]===kept[j-1]+1) cur.push(kept[j]); else { groups.push(cur); cur=[kept[j]]; } }
    groups.push(cur);
    const newRuns=groups.map((g,gi)=>{
      const a=g[0], b=g[g.length-1];   // keep segments a..b -> points a..b+1
      return {...o, id: gi===0?o.id:uid(),
        pts:o.pts.slice(a,b+2), lengths:o.lengths.slice(a,b+1),
        caps:[ a===0?caps[0]:true, b===n-1?caps[1]:true ],
        segLabelOff:undefined, noteOff:undefined };
    });
    const idx=P.objects.findIndex(x=>x.id===o.id);
    P.objects.splice(idx,1,...newRuns);
  }
}
function duplicateSelected(){
  if(sel.size===0) return;
  recordHistory();
  const newSel=new Set();
  [...sel].forEach(id=>{ const o=objById(id); if(!o)return; const c=JSON.parse(JSON.stringify(o)); c.id=uid();
    translateInto(c,JSON.parse(JSON.stringify(o)),GRID,GRID); P.objects.push(c); newSel.add(c.id); });
  sel=newSel; refreshAll();
}

/* INLINE EDITOR (floating input over label boxes)            */
/* ============================================================ */
function byId(id){ return document.getElementById(id); }
const FE = byId("floatEdit");
let editing = null;   // {objId,kind,seg}

function findLabel(kind,objId,seg){
  for(const b of labelBoxes){
    if(b.kind===kind && b.objId===objId && (seg==null || b.seg===seg)) return b;
  }
  return null;
}

function commitEditor(){
  if(!editing) return;
  const inp = FE.querySelector("input,textarea");
  const o = objById(editing.objId);
  if(o && inp){
    const val = inp.value;
    if(editing.kind==="seglen"){
      recordHistory();
      o.lengths[editing.seg] = (val===""?"":Math.max(0,+val||0));
      if(P.settings.resizeOnEdit!==false && (o.t==="gutter"||o.t==="custom")){
        resizeRunSegment(o, editing.seg);
      }
    } else if(editing.kind==="dsnote"){
      o.notation = val;
    } else if(editing.kind==="text"){
      o.text = val;
    } else if(editing.kind==="stamp"){
      o.text = (val||"").toUpperCase();
    }
  }
  FE.style.display="none";
  FE.innerHTML="";
  const was=editing; editing=null;
  refreshAll();
  return was;
}

function openEditorFor(hit){
  if(editing) commitEditor();
  const o = objById(hit.objId); if(!o) return;
  // ensure label boxes are current
  const lb = hit.box || findLabel(hit.kind, hit.objId, hit.seg);
  if(!lb){ return; }
  editing = {objId:hit.objId, kind:hit.kind, seg:hit.seg};
  FE.innerHTML="";
  let field, hintTxt;
  if(hit.kind==="seglen"){
    field=document.createElement("input");
    field.type="number"; field.step="0.1"; field.min="0";
    field.value=(o.lengths[hit.seg]===""||o.lengths[hit.seg]==null)?"":o.lengths[hit.seg];
    field.placeholder="ft";
    field.style.width="74px"; field.style.textAlign="center";
    hintTxt="Length (ft) — Enter for next";
  } else if(hit.kind==="dsnote"){
    field=document.createElement("input");
    field.type="text"; field.value=o.notation||"";
    field.placeholder="AAA 20"; field.style.width="130px"; field.style.textTransform="uppercase";
    hintTxt="elbows/offsets + space + feet";
  } else if(hit.kind==="stamp"){
    field=document.createElement("input");
    field.type="text"; field.value=o.text||""; field.style.width="150px"; field.style.textTransform="uppercase";
    hintTxt="Stamp label";
  } else { // text
    field=document.createElement("textarea");
    field.value=o.text||""; field.rows=Math.max(2,Math.round(o.h/22));
    field.style.width=Math.max(120,lb.w-2)+"px";
    field.style.fontFamily=(o.font||"Arial");
    field.style.fontWeight="400";
    hintTxt="Note text — Shift+Enter for new line";
  }
  FE.appendChild(field);
  const hintEl=document.createElement("div"); hintEl.className="fe-hint"; hintEl.textContent=hintTxt;
  FE.appendChild(hintEl);
  FE.style.display="block";
  // position: clamp inside stage
  const stage=byId("stage");
  let left=lb.x, top=lb.y-2;
  FE.style.left="0px"; FE.style.top="0px";
  // measure
  requestAnimationFrame(()=>{
    const fw=FE.offsetWidth, fh=FE.offsetHeight;
    left=Math.min(Math.max(6,lb.x+lb.w/2-fw/2), stage.clientWidth-fw-6);
    top=Math.min(Math.max(56,lb.y-4), stage.clientHeight-fh-6);
    FE.style.left=left+"px"; FE.style.top=top+"px";
  });
  field.focus();
  if(field.select) field.select();

  field.onkeydown=(ev)=>{
    if(ev.key==="Enter" && !(hit.kind==="text" && ev.shiftKey)){
      ev.preventDefault();
      if(hit.kind==="seglen"){
        const objId=editing.objId, nextSeg=editing.seg+1;
        commitEditor();
        const oo=objById(objId);
        if(oo && oo.lengths && nextSeg < oo.lengths.length){
          setTimeout(()=>openSeg(objId,nextSeg),10);
        }
      } else {
        commitEditor();
      }
    } else if(ev.key==="Escape"){
      ev.preventDefault();
      FE.style.display="none"; FE.innerHTML=""; editing=null; draw();
    }
  };
  field.onblur=()=>{ if(editing) commitEditor(); };
}

function openSeg(objId,segIdx){
  draw(); // make sure label boxes exist
  const lb=findLabel("seglen",objId,segIdx);
  openEditorFor({objId,kind:"seglen",seg:segIdx,box:lb});
}

    if(any){ recordHistory(); renderPhotos(); }
  }
}
// hit-test a vertex of a selected pen/line mark; returns {mark,idx} or null
function photoVertexHit(ph,p,cw,chh){
  const thr=12; // px
  for(const m of ph.strokes){
    if(!photoSelMarks.has(m)) continue;
    if((m.type||"pen")==="text" || !m.pts) continue;
    for(let i=0;i<m.pts.length;i++){
      const dx=(m.pts[i].x-p.x)*cw, dy=(m.pts[i].y-p.y)*chh;
      if(Math.hypot(dx,dy)<=thr) return {mark:m,idx:i};
    }
  }
  return null;
}

  if(!photoSelMarks.size) return;

  photoSelMarks.clear(); renderPhotos(); saveLocal();
}

}

// in-progress polyline for the line tool (single active across cards)
function finishPhotoLine(){
  if(photoLine){ if(photoLine.mark.pts.length<2){ const i=photoLine.ph.strokes.indexOf(photoLine.mark); if(i>=0) photoLine.ph.strokes.splice(i,1); } else { recordHistory(); /* commit */ } const rd=photoLine.redraw; photoLine=null; if(rd) rd(); saveLocal(); }
  updatePhotoLineBar();
}
function cancelPhotoLine(){
  if(photoLine){ const i=photoLine.ph.strokes.indexOf(photoLine.mark); if(i>=0) photoLine.ph.strokes.splice(i,1); const rd=photoLine.redraw; photoLine=null; if(rd) rd(); }
  updatePhotoLineBar();
}
function undoPhotoLinePoint(){
  if(!photoLine) return;
  const m=photoLine.mark;
  if(m.pts.length<=1){ cancelPhotoLine(); return; }
  m.pts.pop();
  if(photoLine.redraw) photoLine.redraw();
  updatePhotoLineBar();
}
function updatePhotoLineBar(){
  const bar=document.getElementById("photoLineBar");
  if(!bar) return;
  bar.style.display = (photoLine && photoLine.mark && photoLine.mark.pts.length>=1) ? "flex" : "none";
}
(function(){
  const d=document.getElementById("plDone"), u=document.getElementById("plUndo");
  if(d) d.onclick=()=>finishPhotoLine();
  if(u) u.onclick=()=>undoPhotoLinePoint();
})();

/* ---- mark geometry helpers (normalized 0..1 coords) ---- */
function markBoundsN(st,cw,chh,pctx){
  if((st.type||"pen")==="text"){
    const fs=Math.max(11,(st.size||16)*(cw/Math.min(520,cw)));
    pctx.save();pctx.font="700 "+fs+"px Arial";const tw=pctx.measureText(st.text||"").width;pctx.restore();
    return {x0:st.x, y0:st.y, x1:st.x+(tw/cw), y1:st.y+(fs/chh)};
  }
  let x0=1,y0=1,x1=0,y1=0;
  for(const p of (st.pts||[])){ x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y); }
  return {x0,y0,x1,y1};
}
function markHitN(st,p,cw,chh,pctx){
  if((st.type||"pen")==="text"){
    const b=markBoundsN(st,cw,chh,pctx);
    return p.x>=b.x0-(6/cw)&&p.x<=b.x1+(6/cw)&&p.y>=b.y0-(6/chh)&&p.y<=b.y1+(6/chh);
  }
  const pts=st.pts||[]; const thr=8/cw;
  if(pts.length===1){ return Math.hypot(pts[0].x-p.x,pts[0].y-p.y)<thr; }
  for(let i=0;i<pts.length-1;i++){
    if(ptSegDistN(p,pts[i],pts[i+1])<Math.max(thr,(st.width||3)/cw)) return true;
  }
  return false;
}
function ptSegDistN(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y;const L2=dx*dx+dy*dy;
  let t=L2?((p.x-a.x)*dx+(p.y-a.y)*dy)/L2:0; t=Math.max(0,Math.min(1,t));
  const cx=a.x+t*dx,cy=a.y+t*dy;return Math.hypot(p.x-cx,p.y-cy);
}
function translateMarkN(st,dx,dy){
  if((st.type||"pen")==="text"){ st.x+=dx; st.y+=dy; }
  else { for(const p of (st.pts||[])) { p.x+=dx; p.y+=dy; } }
}
byId("btnAddPhoto").onclick=()=>byId("photoInput").click();
byId("photoInput").onchange=e=>{
  const files=[...e.target.files];
  let pending=files.length;
  files.forEach(f=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        P.photos.push({name:f.name,dataUrl:rd.result,w:img.naturalWidth,h:img.naturalHeight,strokes:[]});
        if(--pending===0) renderPhotos();
      };
      img.onerror=()=>{ if(--pending===0) renderPhotos(); };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  e.target.value="";
};

function drawPhotoMarks(pctx,ph,cw,chh,liveCursor){
  for(const st of ph.strokes){
    const type=st.type||"pen";
    if(type==="text"){
      const fs=Math.max(11,(st.size||16)*(cw/Math.min(520,ph.w)));
      pctx.save();
      pctx.font="700 "+fs+"px Arial";
      pctx.textBaseline="top";
      const tx=st.x*cw, ty=st.y*chh;
      const tw=pctx.measureText(st.text||"").width;
      pctx.fillStyle="rgba(255,255,255,.82)";
      const padx=5,pady=3;
      roundRect(pctx,tx-padx,ty-pady,tw+padx*2,fs+pady*2,4);pctx.fill();
      pctx.strokeStyle=st.color||"#e01b24";pctx.lineWidth=1.5;pctx.stroke();
      pctx.fillStyle=st.color||"#e01b24";
      pctx.fillText(st.text||"",tx,ty);
      pctx.restore();
      continue;
    }
    if(!st.pts||st.pts.length<1) continue;
    pctx.save();pctx.strokeStyle=st.color;pctx.lineWidth=st.width;pctx.lineCap="round";pctx.lineJoin="round";
    pctx.beginPath();pctx.moveTo(st.pts[0].x*cw,st.pts[0].y*chh);
    for(let i=1;i<st.pts.length;i++)pctx.lineTo(st.pts[i].x*cw,st.pts[i].y*chh);
    pctx.stroke();
    if(type==="line"){ for(const p of st.pts){ pctx.fillStyle="#fff";pctx.lineWidth=1.5;pctx.beginPath();pctx.arc(p.x*cw,p.y*chh,3,0,7);pctx.fill();pctx.stroke(); } }
    pctx.restore();
  }
  // rubber band for in-progress line on this photo
  if(liveCursor && photoLine && photoLine.ph===ph && photoLine.mark.pts.length){
    const m=photoLine.mark;
    pctx.save();pctx.strokeStyle=m.color;pctx.lineWidth=m.width;pctx.setLineDash([6,4]);pctx.lineCap="round";
    pctx.beginPath();const last=m.pts[m.pts.length-1];
    pctx.moveTo(last.x*cw,last.y*chh);pctx.lineTo(liveCursor.x*cw,liveCursor.y*chh);pctx.stroke();pctx.restore();
  }
}

function renderPhotos(){
  const scroll=byId("photoScroll");
  if(!P.photos.length){ scroll.innerHTML=`<div class="photo-empty">No photos yet — click “Add photos” to import.</div>`; return; }
  scroll.innerHTML="";
  P.photos.forEach((ph,idx)=>{
    if(!ph.strokes) ph.strokes=[];
    if(!ph._view) ph._view={s:1,x:0,y:0};
    const card=document.createElement("div"); card.className="photo-card";
    const maxW=520, scale=Math.min(1,maxW/ph.w);
    const cw=Math.round(ph.w*scale), chh=Math.round(ph.h*scale);
    const cv=document.createElement("canvas"); cv.width=cw; cv.height=chh;
    card.appendChild(cv);
    const bar=document.createElement("div"); bar.className="pc-bar";
    bar.innerHTML=`<span style="flex:1;font-size:11px;color:#33455a;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ph.name)}</span>
      <button class="btn-sm" data-zin>＋</button>
      <button class="btn-sm" data-zout>－</button>
      <button class="btn-sm" data-zfit>Fit</button>
      <button class="btn-sm" data-undo>Undo</button>
      <button class="btn-sm" data-clear>Clear</button>
      <button class="btn-sm danger" data-del>Remove</button>`;
    card.appendChild(bar);
    scroll.appendChild(card);

    const V=ph._view;
    function clampView(){
      V.s=Math.max(1,Math.min(8,V.s));
      const minX=cw-cw*V.s, minY=chh-chh*V.s;
      V.x=Math.max(minX,Math.min(0,V.x));
      V.y=Math.max(minY,Math.min(0,V.y));
    }
    function zoomAt(cx,cy,factor){
      // cx,cy in canvas px; keep that point fixed while scaling
      const nx=(cx-V.x)/V.s, ny=(cy-V.y)/V.s;
      V.s*=factor;
      V.s=Math.max(1,Math.min(8,V.s));
      V.x=cx-nx*V.s; V.y=cy-ny*V.s;
      clampView(); redrawPhoto();
    }

    const pctx=cv.getContext("2d");
    let imLoaded=false; const im=new Image();
    im.onload=()=>{ imLoaded=true; redrawPhoto(); };
    im.src=ph.dataUrl;
    function redrawPhoto(cursor){
      pctx.clearRect(0,0,cw,chh);
      pctx.save();
      pctx.translate(V.x,V.y); pctx.scale(V.s,V.s);
      if(imLoaded) pctx.drawImage(im,0,0,cw,chh);
      drawPhotoMarks(pctx,ph,cw,chh,cursor);
      if(linePreview){
        pctx.save();pctx.strokeStyle=photoPen.color;pctx.lineWidth=(photoPen.width)/1;pctx.setLineDash([6/V.s,4/V.s]);pctx.lineCap="round";
        pctx.beginPath();pctx.moveTo(linePreview.from.x*cw,linePreview.from.y*chh);pctx.lineTo(linePreview.to.x*cw,linePreview.to.y*chh);pctx.stroke();pctx.restore();
      }
      // selection highlight + marquee
      if(photoTool==="select"){
        for(const st of ph.strokes){ if(photoSelMarks.has(st)){
          const b=markBoundsN(st,cw,chh,pctx);
          pctx.save();pctx.strokeStyle="#2b7fd0";pctx.lineWidth=1.5/V.s;pctx.setLineDash([5/V.s,4/V.s]);
          pctx.strokeRect(b.x0*cw-4/V.s,b.y0*chh-4/V.s,(b.x1-b.x0)*cw+8/V.s,(b.y1-b.y0)*chh+8/V.s);pctx.restore();
          // draggable vertex handles for pen/line
          if((st.type||"pen")!=="text" && st.pts){
            pctx.save();
            for(const v of st.pts){
              pctx.beginPath();pctx.arc(v.x*cw,v.y*chh,5/V.s,0,7);
              pctx.fillStyle="#fff";pctx.strokeStyle="#2b7fd0";pctx.lineWidth=2/V.s;
              pctx.fill();pctx.stroke();
            }
            pctx.restore();
          }
        }}
      }
      if(marq && marq.ph===ph){
        pctx.save();pctx.strokeStyle="#2b7fd0";pctx.fillStyle="rgba(43,127,208,.12)";pctx.lineWidth=1/V.s;
        const x=Math.min(marq.x0,marq.x1)*cw,y=Math.min(marq.y0,marq.y1)*chh,w2=Math.abs(marq.x1-marq.x0)*cw,h2=Math.abs(marq.y1-marq.y0)*chh;
        pctx.fillRect(x,y,w2,h2);pctx.strokeRect(x,y,w2,h2);pctx.restore();
      }
      pctx.restore();
      if(V.s>1.001){
        pctx.save();pctx.fillStyle="rgba(20,28,38,.7)";pctx.fillRect(6,6,54,18);
        pctx.fillStyle="#fff";pctx.font="700 11px Arial";pctx.textBaseline="middle";
        pctx.fillText(Math.round(V.s*100)+"%",12,16);pctx.restore();
      }
    }
    function pos(ev){
      const r=cv.getBoundingClientRect();
      const cxp=(ev.clientX-r.left)*(r.width?cw/r.width:1);
      const cyp=(ev.clientY-r.top)*(r.height?chh/r.height:1);
      return {x:(cxp-V.x)/(V.s*cw), y:(cyp-V.y)/(V.s*chh)};
    }
    function posCanvas(ev){
      const r=cv.getBoundingClientRect();
      return {x:(ev.clientX-r.left)*(r.width?cw/r.width:1), y:(ev.clientY-r.top)*(r.height?chh/r.height:1)};
    }

    let penStroke=null, selDrag=null, marq=null, movedFlag=false, vtxDrag=null;
    let lineDown=null, linePreview=null;
    const cpts=new Map(); let cgest=null;
    cv.addEventListener("pointerdown",ev=>{
      if(ev.pointerType==="touch"){
        cpts.set(ev.pointerId,posCanvas(ev));
        if(cpts.size===2){
          penStroke=null; selDrag=null; vtxDrag=null; marq=null; lineDown=null; linePreview=null;  // abort single-finger action
          const a=[...cpts.values()];
          cgest={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,c:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},s0:V.s,x0:V.x,y0:V.y};
          redrawPhoto(); return;
        }
        if(cpts.size>2) return;
      }
      if(cgest) return;
      const p=pos(ev);
      if(photoTool==="select"){
        cv.setPointerCapture(ev.pointerId);
        // grab a vertex handle of an already-selected line/pen first
        const vh=photoVertexHit(ph,p,cw,chh);
        if(vh){ vtxDrag=vh; movedFlag=false; return; }
        // topmost mark under cursor
        let hit=null;
        for(let i=ph.strokes.length-1;i>=0;i--){ if(markHitN(ph.strokes[i],p,cw,chh,pctx)){ hit=ph.strokes[i]; break; } }
        if(hit){
          if(ev.shiftKey){ if(photoSelMarks.has(hit)) photoSelMarks.delete(hit); else photoSelMarks.add(hit); }
          else if(!photoSelMarks.has(hit)){ photoSelMarks.clear(); photoSelMarks.add(hit); }
          selDrag={last:p}; movedFlag=false;
        } else {
          if(!ev.shiftKey) photoSelMarks.clear();
          marq={ph,x0:p.x,y0:p.y,x1:p.x,y1:p.y};
        }
        renderPhotosSelOnly(); redrawPhoto();
        return;
      }
      if(photoTool==="pen"){
        cv.setPointerCapture(ev.pointerId);
        penStroke={type:"pen",color:photoPen.color,width:photoPen.width,pts:[p]};
        ph.strokes.push(penStroke);
      } else if(photoTool==="line"){
        if(photoLine && photoLine.ph!==ph) cancelPhotoLine();
        lineDown={x:p.x,y:p.y};   // commit on lift (so a pinch never adds a point)
        linePreview=null;
      } else if(photoTool==="text"){
        const hit=photoTextAt(ph,p,cw,chh,pctx);
        if(hit){ const t=prompt("Edit callout text:",hit.text); if(t!=null){ if(t.trim()===""){ recordHistory(); ph.strokes.splice(ph.strokes.indexOf(hit),1);} else { recordHistory(); hit.text=t; } redrawPhoto(); saveLocal(); } return; }
        const t=prompt("Callout text:",""); if(t&&t.trim()){ recordHistory(); ph.strokes.push({type:"text",color:photoPen.color,size:16,x:p.x,y:p.y,text:t.trim()}); redrawPhoto(); saveLocal(); }
      }
    });
    cv.addEventListener("pointermove",ev=>{
      if(ev.pointerType==="touch" && cpts.has(ev.pointerId)) cpts.set(ev.pointerId,posCanvas(ev));
      if(cgest && cpts.size>=2){
        const a=[...cpts.values()];
        const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
        const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
        let s=cgest.s0*(d/cgest.d); s=Math.max(1,Math.min(8,s));
        const wx=(cgest.c.x-cgest.x0)/cgest.s0, wy=(cgest.c.y-cgest.y0)/cgest.s0;
        V.s=s; V.x=c.x-wx*s; V.y=c.y-wy*s; clampView(); redrawPhoto();
        return;
      }
      if(cgest) return;
      const p=pos(ev);
      if(vtxDrag){ vtxDrag.mark.pts[vtxDrag.idx]={x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))}; movedFlag=true; redrawPhoto(); return; }
      if(selDrag){ const dx=p.x-selDrag.last.x, dy=p.y-selDrag.last.y; selDrag.last=p; if(dx||dy){ movedFlag=true; photoSelMarks.forEach(m=>translateMarkN(m,dx,dy)); redrawPhoto(); } return; }
      if(marq){ marq.x1=p.x; marq.y1=p.y; redrawPhoto(); return; }
      if(penStroke){ penStroke.pts.push(p); redrawPhoto(); }
      else if(lineDown && photoTool==="line"){
        const anchor=(photoLine && photoLine.ph===ph && photoLine.mark.pts.length)?photoLine.mark.pts[photoLine.mark.pts.length-1]:lineDown;
        linePreview={from:anchor,to:p}; redrawPhoto();
      }
      else if(photoLine && photoLine.ph===ph){ redrawPhoto(p); }
    });
    cv.addEventListener("pointerup",ev=>{
      if(ev && ev.pointerType==="touch"){
        cpts.delete(ev.pointerId);
        if(cgest){ if(cpts.size<2) cgest=null; return; }
      }
      if(vtxDrag){ if(movedFlag){ recordHistory(); saveLocal(); } vtxDrag=null; return; }
      if(selDrag){ if(movedFlag){ recordHistory(); saveLocal(); } selDrag=null; return; }
      if(marq){
        const x0=Math.min(marq.x0,marq.x1),y0=Math.min(marq.y0,marq.y1),x1=Math.max(marq.x0,marq.x1),y1=Math.max(marq.y0,marq.y1);
        if(Math.abs(x1-x0)>0.005||Math.abs(y1-y0)>0.005){
          for(const st of ph.strokes){ const b=markBoundsN(st,cw,chh,pctx); if(b.x1>=x0&&b.x0<=x1&&b.y1>=y0&&b.y0<=y1) photoSelMarks.add(st); }
        }
        marq=null; redrawPhoto(); return;
      }
      if(penStroke){ penStroke=null; recordHistory(); saveLocal(); return; }
      if(lineDown && photoTool==="line"){
        const up=pos(ev);
        const moved=Math.hypot(up.x-lineDown.x, up.y-lineDown.y);
        if(!photoLine || photoLine.ph!==ph){
          // start a fresh line at the down point; a drag also drops the end point
          const m={type:"line",color:photoPen.color,width:photoPen.width,pts:[{x:lineDown.x,y:lineDown.y}]};
          ph.strokes.push(m); photoLine={ph,mark:m,redraw:redrawPhoto};
          if(moved>0.012) m.pts.push({x:up.x,y:up.y});
        } else {
          // continuing: connect to the new point (works for both a tap and a drag-out)
          photoLine.mark.pts.push({x:up.x,y:up.y});
        }
        lineDown=null; linePreview=null;
        updatePhotoLineBar(); redrawPhoto();
        return;
      }
    });
    cv.addEventListener("pointerleave",()=>{ if(penStroke){ penStroke=null; recordHistory(); saveLocal(); } if(vtxDrag){ if(movedFlag){recordHistory();saveLocal();} vtxDrag=null; } if(selDrag){ if(movedFlag){recordHistory();saveLocal();} selDrag=null; } if(marq){ marq=null; redrawPhoto(); } if(lineDown){ lineDown=null; linePreview=null; redrawPhoto(); } });
    cv.addEventListener("pointercancel",ev=>{ if(ev&&cpts.has(ev.pointerId)){ cpts.delete(ev.pointerId); if(cgest&&cpts.size<2) cgest=null; } penStroke=null;selDrag=null;vtxDrag=null;lineDown=null;linePreview=null; });
    cv.addEventListener("dblclick",()=>{ if(photoTool==="line" && photoLine && photoLine.ph===ph) finishPhotoLine(); });
    cv.style.cursor = photoTool==="select" ? "default" : "crosshair";

    bar.querySelector("[data-zin]").onclick=()=>zoomAt(cw/2,chh/2,1.4);
    bar.querySelector("[data-zout]").onclick=()=>zoomAt(cw/2,chh/2,1/1.4);
    bar.querySelector("[data-zfit]").onclick=()=>{ V.s=1;V.x=0;V.y=0; redrawPhoto(); };

    bar.querySelector("[data-undo]").onclick=()=>{ if(photoLine&&photoLine.ph===ph) cancelPhotoLine(); else if(ph.strokes.length){ recordHistory(); ph.strokes.pop(); redrawPhoto(); saveLocal(); } };
    bar.querySelector("[data-clear]").onclick=()=>{ cancelPhotoLine(); if(ph.strokes.length){ recordHistory(); ph.strokes=[]; redrawPhoto(); saveLocal(); } };
    bar.querySelector("[data-del]").onclick=()=>{ cancelPhotoLine(); recordHistory(); P.photos.splice(idx,1); renderPhotos(); saveLocal(); };
  });
}
// lightweight: re-highlight selection across all cards without full rebuild
function renderPhotosSelOnly(){ /* selection drawn within each card's redraw; nothing global needed */ }
// hit-test a text callout on a photo (normalized coords)
function photoTextAt(ph,p,cw,chh,pctx){
  for(let i=ph.strokes.length-1;i>=0;i--){
    const st=ph.strokes[i]; if((st.type||"")!=="text") continue;
    const fs=Math.max(11,(st.size||16)*(cw/Math.min(520,ph.w)));
    pctx.save();pctx.font="700 "+fs+"px Arial";const tw=pctx.measureText(st.text||"").width;pctx.restore();
    const x0=st.x*cw, y0=st.y*chh;
    const px=p.x*cw, py=p.y*chh;
    if(px>=x0-6&&px<=x0+tw+6&&py>=y0-6&&py<=y0+fs+6) return st;
  }
  return null;
}

/* ZOOM CONTROLS                                               */
/* ============================================================ */
function updateZoomLabel(){ const z=byId("zLabel"); if(z) z.textContent=Math.round(cam.scale*100)+"%"; }
function zoomAt(factor){
  const cx=view.w/2, cy=view.h/2;
  const before=screenToWorld({x:cx,y:cy});
  cam.scale=Math.max(.15,Math.min(6,cam.scale*factor));
  const after=screenToWorld({x:cx,y:cy});
  cam.x+=before.x-after.x; cam.y+=before.y-after.y;
  updateZoomLabel(); draw();
}
function allBounds(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,any=false;
  for(const o of P.objects){
    const b=objBounds(o); if(!b) continue; any=true;
    minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);
    maxX=Math.max(maxX,b.x+b.w);maxY=Math.max(maxY,b.y+b.h);
  }
  return any?{x:minX,y:minY,w:maxX-minX,h:maxY-minY}:null;
}
function zoomFit(){
  const b=allBounds();
  if(!b){ cam.scale=1; cam.x=-view.w/2; cam.y=-view.h/2; updateZoomLabel(); draw(); return; }
  const pad=60;
  const sx=(view.w-pad*2)/Math.max(1,b.w), sy=(view.h-pad*2)/Math.max(1,b.h);
  cam.scale=Math.max(.15,Math.min(3,Math.min(sx,sy)));
  cam.x=b.x+b.w/2-view.w/(2*cam.scale);
  cam.y=b.y+b.h/2-view.h/(2*cam.scale);
  updateZoomLabel(); draw();
}
byId("zIn").onclick=()=>zoomAt(1.2);
byId("zOut").onclick=()=>zoomAt(1/1.2);

function serialize(){ return JSON.stringify({v:1,project:P,nextId,stampPresets},null,2); }
/* when running inside the native iOS shell, hand saves/prints to Swift;
   in a normal browser these return null and the web path runs unchanged */
function geNative(name){
  try{ return (window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers[name])||null; }catch(e){ return null; }
}
function download(name,text,type){
  const h=geNative("gutterSave");
  if(h){ h.postMessage({name:name,text:String(text)}); return; }
  const blob=new Blob([text],{type:type||"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
byId("btnSave").onclick=()=>{
  const fn=(P.meta.name||"estimate").replace(/[^\w\-]+/g,"_").slice(0,40)+"_gutter.json";
  download(fn,serialize());
  saveLocal();
};
byId("btnLoad").onclick=()=>byId("fileInput").click();
byId("fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      const proj=d.project||d;
      P=Object.assign(defaultProject(),proj);
      P.settings=Object.assign(defaultProject().settings,proj.settings||{});
      P.meta=Object.assign(defaultProject().meta,proj.meta||{});
      P.objects=proj.objects||[]; P.photos=proj.photos||[];
      nextId=d.nextId|| (P.objects.reduce((m,o)=>Math.max(m,o.id||0),0)+1);
      if(d.stampPresets&&d.stampPresets.length){ stampPresets.length=0; d.stampPresets.forEach(s=>stampPresets.push(s)); activeStamp=stampPresets[0]; }
      sel.clear(); ensurePrices();
      byId("paneJob").innerHTML=""; byId("panePricing").innerHTML="";
      buildRail(); buildDock(); buildOptbar(); zoomFit(); refreshAll();
    }catch(err){ alert("Could not read that file: "+err.message); }
  };
  rd.readAsText(f); e.target.value="";
};
byId("btnNew").onclick=()=>{  if(P.objects.length||P.photos.length){ if(!confirm("Start a new estimate? Unsaved changes will be lost.")) return; }
  P=defaultProject(); nextId=1; sel.clear();
  byId("paneJob").innerHTML=""; byId("panePricing").innerHTML="";
  buildRail(); buildOptbar(); zoomFit(); refreshAll();
};

/* light autosave to localStorage (guarded for file://) */
function saveLocal(){ try{ localStorage.setItem("primeGutterEstimate",serialize()); }catch(e){} }
function loadLocal(){
  try{
    const s=localStorage.getItem("primeGutterEstimate");
    if(!s) return false;
    const d=JSON.parse(s); const proj=d.project||d;
    P=Object.assign(defaultProject(),proj);
    P.settings=Object.assign(defaultProject().settings,proj.settings||{});
    P.meta=Object.assign(defaultProject().meta,proj.meta||{});
    P.objects=proj.objects||[]; P.photos=proj.photos||[];
    nextId=d.nextId||(P.objects.reduce((m,o)=>Math.max(m,o.id||0),0)+1);
    if(d.stampPresets&&d.stampPresets.length){ stampPresets.length=0; d.stampPresets.forEach(x=>stampPresets.push(x)); activeStamp=stampPresets[0]; }
    return true;
  }catch(e){ return false; }
}

/* PRINT  — clean estimate sheet                              */

async function photoSnapshot(ph){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement("canvas"); c.width=ph.w; c.height=ph.h;
      const cx=c.getContext("2d"); cx.drawImage(im,0,0);
      for(const st of (ph.strokes||[])){
        const type=st.type||"pen";
        if(type==="text"){
          const fs=Math.max(13,(st.size||16));
          cx.save();cx.font="700 "+fs+"px Arial";cx.textBaseline="top";
          const tx=st.x*ph.w, ty=st.y*ph.h, tw=cx.measureText(st.text||"").width;
          cx.fillStyle="rgba(255,255,255,.85)";roundRect(cx,tx-6,ty-4,tw+12,fs+8,5);cx.fill();
          cx.strokeStyle=st.color||"#e01b24";cx.lineWidth=2;cx.stroke();
          cx.fillStyle=st.color||"#e01b24";cx.fillText(st.text||"",tx,ty);cx.restore();
          continue;
        }
        if(!st.pts||!st.pts.length)continue;
        cx.save();cx.strokeStyle=st.color;cx.lineWidth=st.width;cx.lineCap="round";cx.lineJoin="round";
        cx.beginPath();cx.moveTo(st.pts[0].x*ph.w,st.pts[0].y*ph.h);
        for(let i=1;i<st.pts.length;i++)cx.lineTo(st.pts[i].x*ph.w,st.pts[i].y*ph.h);
        cx.stroke();cx.restore();
      }
      res(c.toDataURL("image/jpeg",0.82));
    };
    im.onerror=()=>res("");
    im.src=ph.dataUrl;
  });
}
async function buildPrintDoc(){
  if(curPage!=="diagram") setPage("diagram");
  const saved={...cam};
  zoomFit(); draw();
  const diagram = P.objects.length ? canvas.toDataURL("image/png") : "";
  Object.assign(cam,saved); draw();

  const photoURLs=[];
  for(const ph of P.photos){ photoURLs.push(await photoSnapshot(ph)); }

  const r=compute(); const m=P.meta; const s=P.settings;
  const flat=s.pricingMode==="flat";
  let rows="";
  for(const L of LINES){
    const qty=r.q[L.key]||0; if(qty===0 && L.src==="auto" && !["gutter6","gutter5"].includes(L.key)) {/* still show */}
    const qtyTxt=L.kind==="ft"?ftStr(qty):(Math.round(qty*10)/10);

    if(!flat){ rows+=`<td class="n">${P.settings.prices[L.key]?money(P.settings.prices[L.key]):""}</td><td class="n">${r.amt[L.key]?money(r.amt[L.key]):""}</td>`; }
    rows+=`</tr>`;
  }
  const css=`*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}

    h1{color:#c8202a;font-size:22px;margin:0}
    .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #c8202a;padding-bottom:8px;margin-bottom:14px}
    .muted{color:#5b6b7a;font-size:12px}
    table{border-collapse:collapse;width:100%;font-size:12.5px}
    .info td{padding:3px 6px;border:1px solid #d9e0e7}
    .ws th{background:#1b2530;color:#fff;text-align:left;padding:6px 8px;font-size:11px}
    .ws td{border-bottom:1px solid #e3e8ee;padding:5px 8px}
    .ws td.n{text-align:right;font-family:'Courier New',monospace}
    .tot{margin-top:12px;width:320px;margin-left:auto;font-size:13px}
    .tot td{padding:5px 8px;border-bottom:1px solid #e3e8ee}
    .tot td.n{text-align:right;font-family:'Courier New',monospace;font-weight:700}
    .grand td{background:#1b2530;color:#fff;font-size:15px;border:0}
    .diagram{border:1px solid #d9e0e7;border-radius:6px;max-width:100%;max-height:9in;display:block;margin:6px auto 0}
    .diagram-page{break-before:page;page-break-before:always;break-inside:avoid;page-break-inside:avoid}
    .chart-page{break-before:page;page-break-before:always}
    .photo-head{break-before:page;page-break-before:always}
    .photo-page{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;break-inside:avoid;page-break-inside:avoid}
    .photo-page.pgbreak{break-before:page;page-break-before:always}
    .pcell{display:flex;align-items:center;justify-content:center;min-height:0}
    .photo-page img{max-width:100%;max-height:4.25in;border:1px solid #ccc;border-radius:6px;object-fit:contain}
    .colorline{font-size:13px;margin:2px 0}
    h3.sec{margin-top:22px;color:#c8202a;border-bottom:2px solid #f0d0d2;padding-bottom:4px}
    .chart{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .cc{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid #e3e8ee;border-radius:8px;font-size:11.5px}
    .cc .ccsw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:0 0 auto}
    .cc.sel{border-color:#c8202a;background:#fff5f5}
    .cc.sel .ccsw{box-shadow:0 0 0 2px #fff,0 0 0 3px #c8202a;border-color:#c8202a}
    .cc .ccn{font-weight:600;line-height:1.1}
    .cc .ccr{margin-left:auto;font-size:9px;font-weight:800;color:#c8202a;text-transform:uppercase;letter-spacing:.3px;text-align:right}
    .mat th{background:#33455a;color:#fff;text-align:left;padding:6px 8px;font-size:11px}
    .mat td{border-bottom:1px solid #e3e8ee;padding:5px 8px}
    .mat td.n{text-align:right;font-family:'Courier New',monospace;width:70px}
    .mat .msw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);vertical-align:middle;margin-right:6px}
    /* keep elements from being split across pages */
    .avoid{break-inside:avoid;page-break-inside:avoid}
    h3.sec{break-after:avoid;page-break-after:avoid}
    thead{display:table-header-group}
    tr{break-inside:avoid;page-break-inside:avoid}
    .cc{break-inside:avoid;page-break-inside:avoid}
    @page{margin:0.5in}
    @media print{.noprint{display:none} .chart{grid-template-columns:repeat(4,1fr)} body{padding:0}}`;
  const colorBlock=`<div class="colorline"><b>Gutter color:</b> ${esc(s.gutterColor)} &nbsp;&nbsp; <b>Downspout color:</b> ${esc(s.downspoutColor)}</div>`;

  // which colors are actually selected for this job (for circling on the chart)
  const usedRoles={};
  const addRole=(name,role)=>{ if(!name)return; (usedRoles[name]=usedRoles[name]||[]); if(!usedRoles[name].includes(role)) usedRoles[name].push(role); };
  // only colors actually used by a drawn gutter/downspout are marked on the chart
  for(const o of P.objects){
    if(o.t==="gutter") addRole(o.color||s.gutterColor,"Gutter");
    else if(o.t==="ds") addRole(o.color||s.downspoutColor,"Downspout");
  }
  const chartCells=COLORS.map(c=>{
    const roles=usedRoles[c.n];
    return `<div class="cc ${roles?"sel":""}"><span class="ccsw" style="background:${c.h}"></span><span class="ccn">${esc(c.n)}</span>${roles?`<span class="ccr">${esc(roles.join(" / "))}</span>`:""}</div>`;
  }).join("");
  const colorChartHTML=`<div class="avoid chart-page"><h3 class="sec">Spectra Metal Sales — Color Chart</h3>
    <div class="muted" style="margin:2px 0 8px">Circled swatches are the colors selected for this job.</div>
    <div class="chart">${chartCells}</div></div>`;

  // material list (bill of materials) with qty + color
  const mats=materialList();
  const matRows=mats.map(x=>{
    const sw=`<span class="msw" style="background:${swatchHex(x.color)}"></span>`;
    const colTxt = x.color ? (/^#/.test(x.color)?"":esc(x.color)) : "—";
    return `<tr><td>${esc(x.item)}</td><td class="n">${x.qty} ${x.unit}</td><td>${x.color?sw:""}${colTxt}</td></tr>`;
  }).join("");
  const materialHTML = mats.length ? `<h3 class="sec">Material List</h3>
    <table class="mat"><thead><tr><th>Item</th><th style="text-align:right">Qty</th><th>Color</th></tr></thead><tbody>${matRows}</tbody></table>` : "";

  // diagram on its very own page so it's never cut across a page break
  const diagramHTML = diagram
    ? `<div class="diagram-page"><h3 class="sec" style="break-after:avoid;page-break-after:avoid">Diagram</h3><img class="diagram" src="${diagram}"></div>`
    : "";

  // photos: 4 to a page (2×2), each group kept whole
  const photos = photoURLs.filter(Boolean);
  let photosHTML = "";
  if(photos.length){
    photosHTML = `<h3 class="sec photo-head">Job Photos</h3>`;
    for(let i=0;i<photos.length;i+=4){
      const cells = photos.slice(i,i+4).map(u=>`<div class="pcell"><img src="${u}"></div>`).join("");
      photosHTML += `<div class="photo-page${i>0?" pgbreak":""}">${cells}</div>`;
    }
  }

  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Estimate ${esc(m.name||"")}</title><style>${css}</style></head><body>
    <div class="head">
      <div><h1>Prime Seamless Gutters &amp; Roofing</h1><div class="muted">San Antonio · Austin &nbsp;|&nbsp; (210) 246-3931 &nbsp;|&nbsp; info@primeseamless.com</div></div>
      <div class="muted" style="text-align:right">Commercial / Residential Estimate<br>${esc(m.date||"")}<br>Quote good for 30 days</div>
    </div>
    <table class="info"><tr><td><b>Name</b></td><td>${esc(m.name)}</td><td><b>Phone</b></td><td>${esc(m.phone)}</td></tr>
      <tr><td><b>Address</b></td><td>${esc(m.address)}</td><td><b>Cell</b></td><td>${esc(m.cell)}</td></tr>
      <tr><td><b>E-mail</b></td><td>${esc(m.email)}</td><td><b>Gate code</b></td><td>${esc(m.gateCode)}</td></tr></table>
    ${colorBlock}
    ${materialHTML}
    <table class="tot avoid">
      <tr><td>Total gutter footage</td><td class="n">${ftStr(r.gutterFootage)}</td></tr>
      <tr><td>Downspout footage</td><td class="n">${ftStr(r.dsFootage)}</td></tr>
      ${(+s.miscDemoLabor)?`<tr><td>Misc / Demo / Labor</td><td class="n">${money(s.miscDemoLabor)}</td></tr>`:""}
      ${r.customTotal?`<tr><td>Custom products</td><td class="n">${money(r.customTotal)}</td></tr>`:""}
      ${s.payMethod==="card"&&r.cardFee?`<tr><td>Card fee (${s.cardFee}%)</td><td class="n">${money(r.cardFee)}</td></tr>`:""}
      <tr class="grand"><td>Turnkey Total</td><td class="n">${money(r.grand)}</td></tr>
      <tr><td>${s.depositPct}% Deposit</td><td class="n">${money(r.deposit)}</td></tr>
      <tr><td>Balance on completion</td><td class="n">${money(r.remaining)}</td></tr>
    </table>
    <p class="muted" style="margin-top:14px">Includes all labor and materials, 100% clean up, haul away. Estimate based on visual inspection; a change order will be submitted for additional work. 25% deposit required; remaining balance due upon completion. Lifetime paint and materials warranty.</p>

    </body></html>`;
  const ph=geNative("gutterPrint");
  if(ph){ ph.postMessage(html); return; }
  const win=window.open("","_blank");
  if(!win){ alert("Please allow pop-ups to export the estimate, or use the in-app Print button."); return; }
  win.document.write(html); win.document.close();
  setTimeout(()=>{ try{win.focus();win.print();}catch(e){} },350);
}
byId("btnPrint").onclick=buildPrintDoc;

/* ============================================================ */
/* KEYBOARD                                                    */
/* ============================================================ */
const TOOLKEYS={v:"select",h:"hand",g:"gutter6",d:"ds3x4","6":"gutter6","5":"gutter5","3":"ds3x4","2":"ds2x3",s:"valley",t:"text",a:"arrow",m:"stamp",y:"hl"};
window.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  const typing = tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable;
  if(e.code==="Space" && !typing){ spaceDown=true; if(!panning)canvas.style.cursor="grab"; e.preventDefault(); return; }
  if(typing) return;
  if(modalWrap.style.display==="flex" && e.key==="Escape"){ closeModal(); return; }
  // photo page: undo/redo, delete selection, finish/cancel line; don't trigger diagram tools
  if(curPage==="photos"){
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); if(e.shiftKey)redo(); else undo(); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
    if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); deletePhotoSelection(); return; }
    if(e.key==="Enter"){ e.preventDefault(); finishPhotoLine(); return; }
    if(e.key==="Escape"){ e.preventDefault(); cancelPhotoLine(); clearPhotoSel(); return; }
    return;
  }
  if((e.ctrlKey||e.metaKey)){
    if(e.key.toLowerCase()==="z"){ e.preventDefault(); if(e.shiftKey)redo(); else undo(); return; }
    if(e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
    if(e.key.toLowerCase()==="d"){ e.preventDefault(); duplicateSelected(); return; }
    if(e.key.toLowerCase()==="s"){ e.preventDefault(); byId("btnSave").click(); return; }
    if(e.key.toLowerCase()==="a"){ e.preventDefault(); sel=new Set(P.objects.map(o=>o.id)); draw(); refreshSelInfo(); return; }
    return;
  }
  if(e.key==="Delete"||e.key==="Backspace"){ if(sel.size){ e.preventDefault(); deleteSelected(); } return; }
  if(e.key==="Enter"){ if(drawing&&drawing.t==="gutter"){ e.preventDefault(); finishGutter(); } else if(drawing&&drawing.t==="custom"){ e.preventDefault(); finishCustom(); } return; }
  if(e.key==="Escape"){ if(calib){calib=null;setHint(toolHint(tool));draw();} else if(drawing){cancelDrawing();} else if(sel.size){sel.clear();draw();refreshSelInfo();} return; }
  const k=e.key.toLowerCase();
  if(TOOLKEYS[k]){ setTool(TOOLKEYS[k]); }
});
window.addEventListener("keyup",e=>{
  if(e.code==="Space"){ spaceDown=false; if(!panning) canvas.style.cursor=(tool==="hand"?"grab":(tool==="select"?"default":"crosshair")); }
});

/* periodic autosave */
let _autosaveT=0;
function scheduleSave(){ clearTimeout(_autosaveT); _autosaveT=setTimeout(saveLocal,1200); }
const _origRefreshAll=refreshAll;
refreshAll=function(){ _origRefreshAll(); scheduleSave(); };

/* ============================================================ */
/* INIT                                                        */
/* ============================================================ */
function init(){
  ensurePrices();
  loadLocal();
  resize();
  buildDock();
  buildRail();
  setTool("gutter6");
  buildOptbar();
  updateZoomLabel();
  recordHistory();
  centerView();
  setHint(toolHint("gutter"));
  // re-measure after the browser/webview has settled layout (fixes blank or corner grid)
  requestAnimationFrame(()=>{ resize(); centerView(); });
  [120,350,800,1500].forEach(ms=>setTimeout(()=>{ resize(); if(!P.objects.length) centerView(); }, ms));
  window.addEventListener("load",()=>{ resize(); centerView(); });
}
function centerView(){
  if(P.objects.length){ zoomFit(); }
  else { cam.x=-view.w/2; cam.y=-view.h/2; updateZoomLabel(); draw(); }
}
init();
