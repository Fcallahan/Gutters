<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prime Gutter Estimator</title>
<style>
:root{
  --ink:#1b2530;            /* chrome / toolbar */
  --ink-2:#243240;
  --ink-line:#33455a;
  --paper:#fbfaf6;          /* drawing surface */
  --paper-edge:#ece8dd;
  --grid:#d7e3ef;           /* graph paper line */
  --grid-strong:#c2d3e4;
  --prime:#c8202a;          /* accent red */
  --prime-dark:#a01820;
  --orange:#ff8a00;         /* valley shield */
  --hl:#ffe24d;             /* highlighter */
  --steel:#5b6776;
  --steel-2:#7c8896;
  --text:#1b2530;
  --text-soft:#5d6b79;
  --line:#dfe4ea;
  --line-2:#eef1f4;
  --good:#1f8a52;
  --field:#ffffff;
  --rail:#f4f6f8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--ui);
  color:var(--text);
  background:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:13px;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ---------- Top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:14px;
  min-height:50px;
  padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
  background:linear-gradient(180deg,var(--ink-2),var(--ink));
  border-bottom:1px solid #0c131b;
  color:#eef2f6;flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.5px}
.brand .mark{
  width:30px;height:30px;border-radius:6px;display:grid;place-items:center;
  background:var(--prime);color:#fff;font-weight:900;font-size:15px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);
}
.brand .sub{font-weight:500;font-size:11px;color:#9fb0c0;letter-spacing:.3px;margin-top:-2px}
.tb-spacer{flex:1}
.tb-btn{
  background:#2c3c4d;color:#dce6ef;border:1px solid #3a4d61;border-radius:7px;
  padding:7px 12px;cursor:pointer;font-weight:600;font-size:12.5px;display:inline-flex;gap:7px;align-items:center;
}
.tb-btn:hover{background:#35495d}
.tb-btn.primary{background:var(--prime);border-color:var(--prime-dark);color:#fff}
.tb-btn.primary:hover{background:#d8242f}
.tb-btn.ghost{background:transparent;border-color:#3a4d61}
.tb-btn.ptool{padding:6px 10px}
.tb-btn.ptool.active{background:var(--prime);border-color:var(--prime);color:#fff}
.page-tabs{display:flex;gap:4px;background:#0f161e;border-radius:8px;padding:3px}
.page-tab{
  padding:6px 14px;border-radius:6px;cursor:pointer;color:#9fb0c0;font-weight:600;font-size:12.5px;border:0;background:transparent
}
.page-tab.active{background:#33455a;color:#fff}

/* ---------- Body layout ---------- */
#body{display:flex;flex:1;min-height:0}

/* ---------- Left worksheet rail ---------- */
#rail{
  width:330px;flex:0 0 330px;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.rail-tabs{display:flex;border-bottom:1px solid var(--line);background:#fff}
.rail-tab{flex:1;padding:9px 4px;text-align:center;cursor:pointer;font-weight:700;font-size:11.5px;color:var(--text-soft);border-bottom:2px solid transparent;letter-spacing:.3px;text-transform:uppercase}
.rail-tab.active{color:var(--prime);border-bottom-color:var(--prime)}
.rail-scroll{overflow-y:auto;flex:1;padding:0}
.rail-pane{display:none;padding:12px 13px 40px}
.rail-pane.active{display:block}

.sec-h{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--steel);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h:first-child{margin-top:2px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

.fld{margin-bottom:9px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--text-soft);margin-bottom:3px;letter-spacing:.2px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #bcd4ec;border-color:#9bbbdc}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* line item worksheet */
.worksheet{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.ws-head{display:grid;grid-template-columns:1fr 52px 64px 70px;gap:0;background:#f0f2f5;border-bottom:1px solid var(--line);
  font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--steel);text-transform:uppercase}
.ws-head>div{padding:6px 7px}
.ws-head>div+div{text-align:right}
.ws-row{display:grid;grid-template-columns:1fr 52px 64px 70px;align-items:center;border-bottom:1px solid var(--line-2);min-height:30px}
.ws-row:last-child{border-bottom:0}
.ws-row.zero{opacity:.45}
.ws-row .ws-lbl{padding:4px 7px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.ws-row .ws-qty{padding:4px 6px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:600}
.ws-row .ws-qty.editable{cursor:text}
.ws-row input.ws-price{width:100%;border:0;border-left:1px solid var(--line-2);text-align:right;padding:6px 7px;font-family:var(--mono);font-size:11.5px;background:transparent}
.ws-row input.ws-price:focus{outline:0;background:#eef6ff}
.ws-row input.ws-qty-in{width:100%;border:0;text-align:right;padding:4px 6px;font-family:var(--mono);font-size:12px;background:#fffdf4}
.ws-row .ws-amt{padding:4px 7px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:700;border-left:1px solid var(--line-2)}
.ws-unit{font-size:9px;color:var(--steel-2);font-weight:700;margin-left:auto;padding-right:2px}

.totline{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:8px;margin-top:9px;font-weight:700}
.totline.foot{background:#eef3f8;border:1px solid #dbe6f1}
.totline.grand{background:var(--ink);color:#fff;font-size:16px}
.totline .v{font-family:var(--mono)}
.mini{font-size:10.5px;color:var(--text-soft);margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.3px}
.pill.auto{background:#e7f3ec;color:var(--good)}

.swatch{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:0 0 auto;display:inline-block;vertical-align:middle}
.colorsel{display:flex;align-items:center;gap:7px}
.colorsel select{flex:1}

.seg-toggle{display:flex;background:#e9edf1;border-radius:7px;padding:3px;gap:3px}
.seg-toggle button{flex:1;border:0;background:transparent;border-radius:5px;padding:6px 4px;font-weight:700;font-size:11.5px;color:var(--text-soft);cursor:pointer}
.seg-toggle button.on{background:#fff;color:var(--prime);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.note{font-size:11px;color:var(--text-soft);line-height:1.5;background:#fff;border:1px dashed var(--line);border-radius:7px;padding:9px}
.btn-sm{background:#eef1f4;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-weight:700;font-size:11.5px;cursor:pointer;color:var(--text)}
.btn-sm:hover{background:#e3e8ee}
.btn-sm.danger{color:var(--prime);border-color:#f1c5c8}

/* ---------- Center canvas ---------- */
#stage{flex:1;position:relative;min-width:0;background:#aeb8c2;overflow:hidden}
#canvas{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#railToggle{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;width:32px;height:32px;border-radius:8px;border:1px solid #3a4d61;background:#2c3c4d;color:#dce6ef;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#diagUndoBar{position:absolute;left:calc(max(12px,env(safe-area-inset-left)) + 40px);bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:6px}
#diagUndoBar button{width:38px;height:32px;border-radius:8px;border:1px solid #3a4d61;background:#2c3c4d;color:#dce6ef;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#diagUndoBar button:disabled{opacity:.4;cursor:default}
#railToggle:hover{background:#35495d}
#drawBar{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:26;display:flex;gap:8px;background:rgba(20,28,38,.92);padding:8px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#drawBar button{padding:11px 18px;border-radius:9px;border:0;font-weight:800;font-size:14px;cursor:pointer}
#drawBar .db-go{background:#1f9d55;color:#fff}
#drawBar .db-x{background:#3a4d61;color:#dce6ef}
#selActionBar{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:27;display:flex;gap:8px;background:rgba(20,28,38,.92);padding:8px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#selActionBar button{padding:11px 18px;border-radius:9px;border:0;font-weight:800;font-size:14px;cursor:pointer}
#selActionBar .db-del{background:#e01b24;color:#fff}
#selActionBar .db-x{background:#3a4d61;color:#dce6ef}
#photoLineBar{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;gap:8px;background:rgba(20,28,38,.94);padding:8px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#photoLineBar button{padding:12px 20px;border-radius:9px;border:0;font-weight:800;font-size:15px;cursor:pointer}
#photoStage{position:absolute;inset:0;display:none;flex-direction:column}

/* tool dock */
#dock{
  position:absolute;left:12px;top:12px;z-index:6;
  background:var(--ink);border:1px solid #0c131b;border-radius:12px;padding:6px;
  display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 26px rgba(0,0,0,.35);
}
.tool{
  width:40px;height:40px;border-radius:9px;border:0;background:transparent;color:#aebccb;cursor:pointer;
  display:grid;place-items:center;position:relative;
}
.tool:hover{background:#2a3a4b;color:#fff}
.tool.active{background:var(--prime);color:#fff}
.tool svg{width:20px;height:20px}
.tool .tlbl{position:absolute;left:0;right:0;bottom:1px;font-size:7.5px;font-weight:800;text-align:center;letter-spacing:.2px;color:#8fa0b2}
.tool.active .tlbl{color:rgba(255,255,255,.85)}
.tool:has(.tlbl) svg{margin-top:-5px}
.tool .kbd{position:absolute;right:3px;top:2px;font-size:8px;color:#6f8092;font-weight:800}
.tool.active .kbd{color:rgba(255,255,255,.7)}
.dock-div{height:1px;background:#2a3a4b;margin:3px 2px}
.tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#0c131b;color:#fff;padding:5px 9px;border-radius:6px;font-size:11.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;font-weight:600}
.tool:hover .tip{opacity:1}

/* contextual options bar (top of canvas) */
#optbar{
  position:absolute;left:64px;top:12px;right:12px;z-index:5;height:42px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;
  display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 6px 18px rgba(0,0,0,.16);overflow-x:auto
}
#optbar .ob-title{font-weight:800;font-size:12px;color:var(--prime);letter-spacing:.3px;white-space:nowrap}
#optbar .ob-grp{display:flex;align-items:center;gap:6px;white-space:nowrap}
#optbar .ob-grp label{font-size:11px;font-weight:700;color:var(--text-soft)}
#optbar select,#optbar input{padding:5px 7px;border:1px solid var(--line);border-radius:6px}
#optbar .div{width:1px;height:22px;background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-weight:700;font-size:11.5px;cursor:pointer;background:#fff;color:var(--text)}
.chip.on{background:var(--prime);color:#fff;border-color:var(--prime-dark)}

/* zoom + status */
#statusbar{
  position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:6px;align-items:center;
}
.zbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;font-weight:700;color:var(--text);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.zlabel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:34px;display:flex;align-items:center;font-family:var(--mono);font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
  background:rgba(27,37,48,.93);color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;max-width:80%;text-align:center
}

/* floating inline editor */
#floatEdit{position:absolute;z-index:20;display:none}
#floatEdit input,#floatEdit textarea{
  border:2px solid var(--prime);border-radius:6px;padding:5px 7px;font-family:var(--mono);font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,.25);background:#fff;min-width:60px
}
#floatEdit .fe-hint{font-size:9.5px;color:#fff;background:var(--prime);border-radius:4px;padding:2px 5px;margin-top:3px;display:inline-block;font-weight:700}

/* photo page */
#photoBar{height:46px;background:var(--ink);display:flex;align-items:center;gap:10px;padding:0 14px;color:#dce6ef;flex:0 0 auto}
#photoScroll{flex:1;overflow:auto;background:#9aa6b1;padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start}
.photo-card{background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;position:relative}
.photo-card canvas{display:block;cursor:crosshair;touch-action:none}
.photo-card .pc-bar{display:flex;gap:6px;align-items:center;padding:7px 9px;border-top:1px solid var(--line);background:#f6f8fa}
.photo-empty{color:#33455a;text-align:center;margin:auto;font-weight:700}

/* modal */
#modalWrap{position:fixed;inset:0;background:rgba(15,22,30,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:18px 20px}
.modal-x{border:0;background:#eef1f4;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:17px}
.stamp-preset{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer}
.stamp-preset:hover{border-color:var(--prime)}
.swatch-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0}
.swatch-grid button{height:26px;border-radius:6px;border:2px solid rgba(0,0,0,.15);cursor:pointer}
.swatch-grid button.sel{border-color:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c2cbd4;border-radius:6px;border:2px solid transparent;background-clip:content-box}
.rail-scroll::-webkit-scrollbar-thumb{background:#c2cbd4;border-radius:6px;border:2px solid var(--rail);background-clip:content-box}

@media print{
  #topbar,#dock,#optbar,#statusbar,#hint,#rail .rail-tabs,#photoBar{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="brand">
      <div class="mark">P</div>
      <div>
        PRIME GUTTER ESTIMATOR
        <div class="sub">Field worksheet &amp; takeoff tool</div>
      </div>
    </div>
    <div class="page-tabs" style="margin-left:6px">
      <button class="page-tab active" data-page="diagram" id="tabDiagram">Diagram</button>
      <button class="page-tab" data-page="photos" id="tabPhotos">Photos</button>
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-btn ghost" id="btnSettings" title="Job defaults, rates & rules">⚙ Settings</button>
    <button class="tb-btn ghost" id="btnNew">New</button>
    <button class="tb-btn ghost" id="btnLoad">Open</button>
    <button class="tb-btn" id="btnSave">Save</button>
    <button class="tb-btn primary" id="btnPrint">Print / PDF</button>
    <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
  </div>

  <div id="body">
    <!-- LEFT RAIL -->
    <div id="rail">
      <div class="rail-tabs">
        <div class="rail-tab active" data-pane="estimate">Estimate</div>
        <div class="rail-tab" data-pane="job">Job Info</div>
        <div class="rail-tab" data-pane="pricing">Pricing</div>
      </div>
      <div class="rail-scroll">
        <!-- ESTIMATE PANE -->
        <div class="rail-pane active" data-pane="estimate" id="paneEstimate"></div>
        <!-- JOB PANE -->
        <div class="rail-pane" data-pane="job" id="paneJob"></div>
        <!-- PRICING PANE -->
        <div class="rail-pane" data-pane="pricing" id="panePricing"></div>
      </div>
    </div>

    <!-- CENTER STAGE -->
    <div id="stage">
      <canvas id="canvas"></canvas>

      <button id="railToggle" title="Hide / show panel">⟨</button>

      <!-- undo / redo (no keyboard needed on iPad) -->
      <div id="diagUndoBar">
        <button id="diagUndo" title="Undo">↶</button>
        <button id="diagRedo" title="Redo">↷</button>
      </div>

      <!-- tool dock -->
      <div id="dock"></div>

      <!-- contextual options -->
      <div id="optbar"></div>

      <!-- finish/cancel an in-progress run (no keyboard needed on iPad) -->
      <div id="drawBar" style="display:none">
        <button id="drawFinish" class="db-go">✓ Finish run</button>
        <button id="drawCancel" class="db-x">✕ Cancel</button>
      </div>

      <!-- delete/clear the current selection (segments or objects) -->
      <div id="selActionBar" style="display:none">
        <button id="selDeleteBtn" class="db-del">🗑 <span id="selDelLabel">Delete</span></button>
        <button id="selClearBtn" class="db-x">Deselect</button>
      </div>

      <!-- inline editor -->
      <div id="floatEdit"></div>

      <!-- zoom -->
      <div id="statusbar">
        <button class="zbtn" id="zOut">−</button>
        <div class="zlabel" id="zLabel">100%</div>
        <button class="zbtn" id="zIn">+</button>
        <button class="zbtn" id="zFit" title="Fit to view">⤢</button>
      </div>
      <div id="hint"></div>

      <!-- PHOTO PAGE -->
      <div id="photoStage">
        <div id="photoBar">
          <strong style="letter-spacing:.4px">PHOTO MARKUP</strong>
          <span style="color:#9fb0c0;font-size:12px" id="photoHint">Import photos and mark up the runs.</span>
          <div class="tb-spacer" style="flex:1"></div>
          <button class="tb-btn" id="btnAddPhoto">+ Add photos</button>
          <div class="ob-grp" id="photoTools" style="display:flex;gap:4px;align-items:center">
            <button class="tb-btn ptool" data-ptool="select">⬚ Select</button>
            <button class="tb-btn ptool" data-ptool="pen">✎ Pen</button>
            <button class="tb-btn ptool" data-ptool="line">╱ Line</button>
            <button class="tb-btn ptool" data-ptool="text">T Text</button>
          </div>
          <div class="ob-grp" style="display:flex;gap:4px;align-items:center">
            <button class="tb-btn" id="photoUndo" title="Undo (Ctrl+Z)">↶</button>
            <button class="tb-btn" id="photoRedo" title="Redo (Ctrl+Y)">↷</button>
          </div>
          <div class="ob-grp" style="display:flex;gap:6px;align-items:center">
            <input type="color" id="photoColor" value="#e01b24" style="width:34px;height:26px;border:0;background:none;cursor:pointer">
            <input type="range" id="photoWidth" min="1" max="14" value="4" style="width:72px" title="Line / pen width">
          </div>
        </div>
        <div id="photoScroll">
          <div class="photo-empty">No photos yet — click “Add photos” to import.</div>
        </div>
        <div id="photoLineBar" style="display:none">
          <button id="plUndo" class="db-x">↶ Undo point</button>
          <button id="plDone" class="db-go">✓ Done</button>

/* ============================================================ */
/* CAMERA / CANVAS                                              */
/* ============================================================ */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let DPR = window.devicePixelRatio||1;
let railHidden = false;
let cam = {x:0,y:0,scale:1};   // world->screen: screen = (world - cam)*scale ... we use translate/scale
let view = {w:0,h:0};

function resize(){
  DPR = window.devicePixelRatio||1;
  // size from the STAGE (stable); never from the canvas itself (can collapse to 300x150)
  const stage = document.getElementById("stage");
  let r = stage ? stage.getBoundingClientRect() : null;
  let w = r ? r.width : 0, h = r ? r.height : 0;
  if(w < 50 || h < 50){
    w = Math.max(50, window.innerWidth - (railHidden?0:330));
    h = Math.max(50, window.innerHeight - 50);
  }
  view.w = w; view.h = h;
  canvas.width = Math.round(w*DPR);
  canvas.height= Math.round(h*DPR);
  draw();
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,150));
if(window.visualViewport){ window.visualViewport.addEventListener("resize",()=>resize()); }
// keep the canvas locked to the stage size at all times
if(window.ResizeObserver){
  const ro = new ResizeObserver(()=>resize());
  const stageEl = document.getElementById("stage");
  if(stageEl) ro.observe(stageEl);
}

function worldToScreen(p){ return {x:(p.x-cam.x)*cam.scale, y:(p.y-cam.y)*cam.scale}; }
function screenToWorld(p){ return {x:p.x/cam.scale+cam.x, y:p.y/cam.scale+cam.y}; }
function evtPos(e){
  const r=canvas.getBoundingClientRect();
  const sx = r.width ? (view.w/r.width) : 1;
  const sy = r.height ? (view.h/r.height) : 1;
  return {x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy};
}

/* world unit: 1 unit = 1 px at scale 1. Grid square = 20 world units */
const GRID = 20;

/* convert a drawn world-distance to feet using the current scale */
function autoFeet(worldDist){
  const fps = +P.settings.feetPerSquare || 0;
  if(fps<=0) return 0;
  const ft = (worldDist / GRID) * fps;
  return Math.round(ft*2)/2;   // nearest half-foot
}
function autoLen(a,b){ return autoFeet(dist(a,b)); }

/* inverse of autoFeet: feet -> drawn world length at current scale */
function feetToWorld(ft){
  const fps=+P.settings.feetPerSquare||0;
  if(fps<=0) return 0;
  return (ft/fps)*GRID;
}
/* resize a run's segment to match its typed footage (preserving direction),
   translate the rest of the run rigidly, and keep connected runs welded. */
function resizeRunSegment(run, segIdx){
  if(!run||!run.pts||segIdx<0||segIdx>=run.pts.length-1) return;
  const ft=run.lengths[segIdx];
  if(ft===""||ft==null||!(+ft>0)) return;
  const newLen=feetToWorld(+ft);
  if(newLen<=0) return;
  const a=run.pts[segIdx], b=run.pts[segIdx+1];
  let dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  if(len<1e-6){ // zero-length segment: take previous direction or horizontal
    if(segIdx>0){ const p=run.pts[segIdx-1]; dx=a.x-p.x; dy=a.y-p.y; len=Math.hypot(dx,dy); }
    if(len<1e-6){ dx=1; dy=0; len=1; }
  }
  const ux=dx/len, uy=dy/len;
  const newBx=a.x+ux*newLen, newBy=a.y+uy*newLen;
  const shx=newBx-b.x, shy=newBy-b.y;
  if(Math.abs(shx)<1e-6 && Math.abs(shy)<1e-6) return;
  const oldEnd={x:run.pts[run.pts.length-1].x, y:run.pts[run.pts.length-1].y};
  // translate this point and everything after it rigidly
  for(let i=segIdx+1;i<run.pts.length;i++){ run.pts[i].x+=shx; run.pts[i].y+=shy; }
  // weld: any OTHER run endpoint that was joined at the old end follows to the new end
  const newEnd=run.pts[run.pts.length-1];
  for(const o of P.objects){
    if(o===run) continue;
    if((o.t==="gutter"||o.t==="custom")&&o.pts&&o.pts.length){
      const L=o.pts.length-1;
      if(dist(o.pts[0],oldEnd)<CAP_EPS){ o.pts[0].x=newEnd.x; o.pts[0].y=newEnd.y; }
      if(dist(o.pts[L],oldEnd)<CAP_EPS){ o.pts[L].x=newEnd.x; o.pts[L].y=newEnd.y; }
    }
  }
}

/* placeholder so later script section can attach */
let draw = function(){};

/* ============================================================ */
/* GEOMETRY HELPERS                                             */
/* ============================================================ */
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function angleAtDeg(a,b,c){
  // interior angle at b, in degrees [0,180]
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const m1=Math.hypot(v1.x,v1.y), m2=Math.hypot(v2.x,v2.y);
  if(m1===0||m2===0) return 180;
  let cosv=(v1.x*v2.x+v1.y*v2.y)/(m1*m2);
  cosv=Math.max(-1,Math.min(1,cosv));
  return Math.acos(cosv)*180/Math.PI;
}
function ptSegDist(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const L2=dx*dx+dy*dy;
  if(L2===0) return dist(p,a);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}

/* parse a downspout notation string like "AAB24 30" */
function parseDS(str){
  str=(str||"").trim();
  let comps="", feet=0;
  if(str){
    const parts=str.split(/\s+/);
    if(parts.length===1){
      if(/^[0-9]+(\.[0-9]+)?$/.test(parts[0])) feet=parseFloat(parts[0]);
      else comps=parts[0];
    }else{
      comps=parts[0];
      const last=parts[parts.length-1];
      if(/^[0-9]+(\.[0-9]+)?$/.test(last)) feet=parseFloat(last);
      else comps=parts.join("");
    }
  }
  let a=0,b=0,o2=0,o4=0,o6=0;
  for(const ch of comps.toUpperCase()){
    if(ch==="A")a++; else if(ch==="B")b++;
    else if(ch==="2")o2++; else if(ch==="4")o4++; else if(ch==="6")o6++;
  }
  return {a,b,o2,o4,o6,feet,elbows:a+b,offsets:o2+o4+o6,outlets:1};
}

/* downspout size allowed for current gutter type */
function allowedDsSizes(){ return ["3x4","2x3"]; }
function dsSizeFor(o){
  return o.size || P.settings.defaultDownspoutSize;
}
function gutterSizeFor(run){ return run.size || P.settings.gutterType; } // "6K" | "5K"

/* ---- end-cap connectivity ----
   A gutter end gets an end cap ONLY if it is a free (open) end:
   not shared with another gutter end, and not the closing point of a loop.
   So a closed box of runs has zero end caps. */
const CAP_EPS = 11; // world units; snapped/shared ends sit much closer than this
function gutterEndList(){
  const a=[];
  for(const o of P.objects){
    if(o.t!=="gutter"||!o.pts||o.pts.length<2) continue;
    a.push({x:o.pts[0].x,y:o.pts[0].y,id:o.id,which:0});
    const L=o.pts.length-1;
    a.push({x:o.pts[L].x,y:o.pts[L].y,id:o.id,which:1});
  }
  return a;
}
function freeEnds(o){
  if(!o.pts||o.pts.length<2) return [false,false];
  const a=o.pts[0], b=o.pts[o.pts.length-1];
  // closed loop -> both ends meet -> no caps
  if(o.pts.length>=3 && dist(a,b)<CAP_EPS) return [false,false];
  const ends=gutterEndList();
  const free=(p,selfWhich)=>{
    for(const e of ends){
      if(e.id===o.id && e.which===selfWhich) continue; // skip own matching end
      if(dist(e,p)<CAP_EPS) return false;              // shares with another end -> corner/junction
    }
    return true;
  };
  return [free(a,0), free(b,1)];
}
/* nearest open gutter endpoint to a world point, within a grab threshold */
function findGutterEndNear(w){
  const thr=Math.max(GRID*0.55, 14/cam.scale);
  let best=null, bd=thr;
  for(const o of P.objects){
    if(o.t!=="gutter"||!o.pts||o.pts.length<1) continue;
    const ends=[{pt:o.pts[0],end:0},{pt:o.pts[o.pts.length-1],end:1}];
    for(const e of ends){
      const d=dist(w,e.pt);
      if(d<bd){ bd=d; best={o,end:e.end,pt:e.pt}; }
    }
  }
  return best;
}

/* corners of a gutter run -> classification */
function runCorners(run){
  const out=[];
  const s=P.settings;
  const pts=run.pts;
  for(let i=1;i<pts.length-1;i++){
    const ang=angleAtDeg(pts[i-1],pts[i],pts[i+1]);
    if(ang>=s.straightMax) continue; // basically straight, not a corner
    const bay = Math.abs(ang-90) >= s.bayDeviation;
    out.push({i, ang, bay, pt:pts[i]});
  }
  // closed loop: the shared start/end vertex is also a corner
  if(pts.length>=4 && dist(pts[0],pts[pts.length-1])<CAP_EPS){
    const ang=angleAtDeg(pts[pts.length-2], pts[0], pts[1]);
    if(ang<s.straightMax){
      out.push({i:0, ang, bay:Math.abs(ang-90)>=s.bayDeviation, pt:pts[0]});
    }
  }
  return out;
}

/* ============================================================ */
/* TAKEOFF / COMPUTE                                            */
/* ============================================================ */
function compute(){
  ensurePrices();
  const s=P.settings;
  const q={gutter6:0,gutter5:0,ds3x4:0,ds2x3:0,
    diverters:+s.diverters||0, outlet3x4:0,outlet2x3:0, valley:0,
    splash:+s.splashBlocks||0, leaf6:+s.leafGuard6||0, leaf5:+s.leafGuard5||0,
    strip:0,box:0,bay:0, elbow3x4:0,elbow2x3:0, offset3x4:0,offset2x3:0,
    endcap6:0,endcap5:0};
  let corners=0;
  const customAgg={};
  const dsRaw={};   // downspout pipe footage by size|color, before 10ft rounding

  for(const o of P.objects){
    if(o.t==="gutter"){
      const ft=(o.lengths||[]).reduce((a,b)=>a+(+b||0),0);
      const g6 = gutterSizeFor(o)==="6K";
      if(g6) q.gutter6+=ft; else q.gutter5+=ft;
      // corners
      const cs=runCorners(o);
      for(const c of cs){
        corners++;
        if(c.bay) q.bay++;
        else if(s.regularMiter==="strip") q.strip++; else q.box++;
      }
      // end caps: only on free (open) ends; corners/junctions/closed loops get none
      const fe=freeEnds(o);
      const cm=o.caps||[true,true];
      let caps=0;
      for(let i=0;i<2;i++){ if(fe[i] && cm[i]!==false) caps++; }
      if(g6) q.endcap6+=caps; else q.endcap5+=caps;
    } else if(o.t==="ds"){
      const d=parseDS(o.notation);
      const sz=dsSizeFor(o);
      const colorName=o.color||s.downspoutColor;
      dsRaw[sz+"|"+colorName]=(dsRaw[sz+"|"+colorName]||0)+d.feet;  // raw pipe, rounded after loop
      if(sz==="3x4"){ q.elbow3x4+=d.elbows; q.offset3x4+=d.offsets; q.outlet3x4+=d.outlets; }
      else { q.elbow2x3+=d.elbows; q.offset2x3+=d.offsets; q.outlet2x3+=d.outlets; }
    } else if(o.t==="valley"){
      q.valley++;
    } else if(o.t==="custom"){
      const ft=(o.lengths||[]).reduce((a,b)=>a+(+b||0),0);
      const prod=(s.customProducts||[]).find(x=>x.id===o.productId);
      const pid=o.productId||"_";
      if(!customAgg[pid]) customAgg[pid]={id:pid,name:prod?prod.name:"Custom",rate:prod?(+prod.pricePerFoot||0):0,color:(prod?prod.color:o.color)||"#7a4fd6",feet:0};
      customAgg[pid].feet+=ft;
    }
  }
  // custom product rows + total cost
  const customRows=Object.values(customAgg).map(c=>({...c,amount:c.feet*c.rate}));
  const customTotal=customRows.reduce((a,c)=>a+c.amount,0);
  const customFootage=customRows.reduce((a,c)=>a+c.feet,0);

  // round each downspout pipe group (size+color) up to 10ft sections, then total by size
  for(const k in dsRaw){
    const sz=k.split("|")[0];
    const ft=dsRound(dsRaw[k]);
    if(sz==="3x4") q.ds3x4+=ft; else q.ds2x3+=ft;
  }

  const outlets=q.outlet3x4+q.outlet2x3;
  const elbowsTot=q.elbow3x4+q.elbow2x3;
  const offsetsTot=q.offset3x4+q.offset2x3;
  const endcapsTot=q.endcap6+q.endcap5;
  // total gutter linear footage (drives flat per-foot pricing). End caps add here (gutter component).
  // Always rounded UP to the nearest whole foot.
  const gutterFootage = Math.ceil(
    q.gutter6+q.gutter5
    + corners*(+s.footagePerCorner||0)
    + outlets*(+s.footagePerOutlet||0)
    + q.valley*(+s.footagePerValley||0)
    + endcapsTot*(+s.footagePerEndcap||0)
  );
  // downspout footage. Elbows + offsets add here (downspout components).
  const dsFootage = q.ds3x4+q.ds2x3
    + elbowsTot*(+s.footagePerElbow||0)
    + offsetsTot*(+s.footagePerOffset||0);

  // amounts (itemized)
  const pr=s.prices;
  const amt={
    gutter6:q.gutter6*pr.gutter6, gutter5:q.gutter5*pr.gutter5,
    ds3x4:q.ds3x4*pr.ds3x4, ds2x3:q.ds2x3*pr.ds2x3,
    diverters:q.diverters*pr.diverters, outlet3x4:q.outlet3x4*pr.outlet3x4, outlet2x3:q.outlet2x3*pr.outlet2x3,
    valley:q.valley*pr.valley, splash:q.splash*pr.splash, leaf6:q.leaf6*pr.leaf6, leaf5:q.leaf5*pr.leaf5,
    strip:q.strip*pr.strip, box:q.box*pr.box, bay:q.bay*pr.bay,
    elbow3x4:q.elbow3x4*pr.elbow3x4, elbow2x3:q.elbow2x3*pr.elbow2x3,
    offset3x4:q.offset3x4*pr.offset3x4, offset2x3:q.offset2x3*pr.offset2x3,
    endcap6:q.endcap6*pr.endcap6, endcap5:q.endcap5*pr.endcap5
  };
  const itemizedSub = Object.values(amt).reduce((a,b)=>a+b,0);

  const leafAmount = q.leaf6*pr.leaf6 + q.leaf5*pr.leaf5;
  let turnkey;
  if(s.pricingMode==="flat"){
    turnkey = gutterFootage*(+s.flatGutterRate||0) + dsFootage*(+s.flatDownspoutRate||0)
              + leafAmount + customTotal + (+s.miscDemoLabor||0);
  }else{
    turnkey = itemizedSub + customTotal + (+s.miscDemoLabor||0);
  }

  const cardFee = s.payMethod==="card" ? turnkey*(+s.cardFee||0)/100 : 0;
  const grand = turnkey + cardFee;
  const deposit = grand*(+s.depositPct||0)/100;
  const remaining = grand - deposit;

  return {q,amt,corners,outlets,gutterFootage,dsFootage,itemizedSub,leafAmount,
          customRows,customTotal,customFootage,
          turnkey,cardFee,grand,deposit,remaining};
}

function money(n){ return "$"+(Math.round((+n||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ftStr(n){ n=+n||0; return (Math.round(n*10)/10)+"'"; }
function colorHex(name){ const c=COLORS.find(c=>c.n===name); return c?c.h:"#888"; }
/* downspout pipe is sold in 10ft sections -> round a footage up to the next 10 */
function dsRound(n){ n=+n||0; if(n<=0) return 0; return (P.settings.roundDownspoutTo10!==false) ? Math.ceil(n/10)*10 : n; }
function swatchHex(color){ if(!color) return "#ccc"; return /^#/.test(color)? color : colorHex(color); }
function r1(n){ return Math.round((+n||0)*10)/10; }

/* full bill of materials with quantities and colors */
function materialList(){
  const r=compute(); const s=P.settings;
  const gut={}, gutParts={}, ds={}, dsParts={};
  let valley=0;
  const add=(map,key,base)=>{ if(!map[key]) map[key]=Object.assign({qty:0},base); return map[key]; };
  for(const o of P.objects){
    if(o.t==="gutter"){
      const size=gutterSizeFor(o)==="6K"?'6" K-style':'5" K-style';
      const colorName=o.color||s.gutterColor;
      const ft=(o.lengths||[]).reduce((a,b)=>a+(+b||0),0);
      add(gut,size+"|"+colorName,{item:"Gutter "+size,unit:"ft",color:colorName}).qty+=ft;
      for(const c of runCorners(o)){
        const part=c.bay?"Bay miter":(s.regularMiter==="strip"?"Strip miter":"Box miter");
        add(gutParts,part+"|"+colorName,{item:part,unit:"ea",color:colorName}).qty+=1;
      }
      const fe=freeEnds(o); const cm=o.caps||[true,true];
      const cs=gutterSizeFor(o)==="6K"?'6"':'5"';
      let caps=0; for(let i=0;i<2;i++) if(fe[i]&&cm[i]!==false) caps++;
      if(caps) add(gutParts,'End cap '+cs+"|"+colorName,{item:'End cap '+cs,unit:"ea",color:colorName}).qty+=caps;
    } else if(o.t==="ds"){
      const szl=dsSizeFor(o)==="3x4"?'3×4':'2×3';
      const colorName=o.color||s.downspoutColor;
      const d=parseDS(o.notation);
      add(ds,szl+"|"+colorName,{item:"Downspout "+szl,unit:"ft",color:colorName}).qty+=d.feet;
      if(d.outlets) add(dsParts,'Outlet '+szl,{item:"Outlet "+szl,unit:"ea",color:""}).qty+=d.outlets;
      if(d.a) add(dsParts,'A elbow '+szl+"|"+colorName,{item:"A elbow "+szl,unit:"ea",color:colorName}).qty+=d.a;
      if(d.b) add(dsParts,'B elbow '+szl+"|"+colorName,{item:"B elbow "+szl,unit:"ea",color:colorName}).qty+=d.b;
      if(d.offsets) add(dsParts,'Offset '+szl+"|"+colorName,{item:"Offset "+szl,unit:"ea",color:colorName}).qty+=d.offsets;
    } else if(o.t==="valley"){ valley++; }
  }
  const out=[];
  Object.values(gut).forEach(v=>out.push({item:v.item,qty:r1(v.qty),unit:v.unit,color:v.color}));
  Object.values(gutParts).forEach(v=>out.push({item:v.item,qty:v.qty,unit:v.unit,color:v.color}));
  Object.values(ds).forEach(v=>out.push({item:v.item,qty:dsRound(v.qty),unit:v.unit,color:v.color}));
  Object.values(dsParts).forEach(v=>out.push({item:v.item,qty:v.qty,unit:v.unit,color:v.color}));
  if(valley) out.push({item:"Valley shield",qty:valley,unit:"ea",color:""});
  if(+s.diverters) out.push({item:"Diverters",qty:+s.diverters,unit:"ea",color:s.gutterColor});
  if(+s.splashBlocks) out.push({item:"Splash blocks",qty:+s.splashBlocks,unit:"ea",color:""});
  if(+s.leafGuard6) out.push({item:'Leaf guard 6"',qty:+s.leafGuard6,unit:"ft",color:s.gutterColor});
  if(+s.leafGuard5) out.push({item:'Leaf guard 5"',qty:+s.leafGuard5,unit:"ft",color:s.gutterColor});
  (r.customRows||[]).forEach(c=>out.push({item:c.name+" (custom)",qty:r1(c.feet),unit:"ft",color:c.color}));
  return out;
}

/* ============================================================ */
/* RENDERING                                                    */
/* ============================================================ */
let labelBoxes=[];   // editable/clickable screen regions, rebuilt each draw
let sel=new Set();   // selected object ids
let segSel=new Set();   // keys "objId:seg" -> individually selected gutter/custom segments
function segKey(id,seg){ return id+":"+seg; }
function parseSegKey(k){ const i=k.lastIndexOf(":"); return {objId:+k.slice(0,i), seg:+k.slice(i+1)}; }
// runs that are "active" for vertex-dot editing (selected whole, or have a selected segment)
function activeRunIds(){
  const ids=new Set();
  sel.forEach(id=>{ const o=objById(id); if(o&&(o.t==="gutter"||o.t==="custom")) ids.add(id); });
  segSel.forEach(k=>{ ids.add(parseSegKey(k).objId); });
  return ids;
}
// does screen segment p1->p2 touch the screen rect r?
function segIntersectsRect(p1,p2,r){
  const inside=p=>p.x>=r.x0&&p.x<=r.x1&&p.y>=r.y0&&p.y<=r.y1;
  if(inside(p1)||inside(p2)) return true;
  const C=[{x:r.x0,y:r.y0},{x:r.x1,y:r.y0},{x:r.x1,y:r.y1},{x:r.x0,y:r.y1}];
  for(let i=0;i<4;i++){ if(segSegHit(p1,p2,C[i],C[(i+1)%4])) return true; }
  return false;
}
function segSegHit(a,b,c,d){
  const cr=(o,p,q)=>(p.x-o.x)*(q.y-o.y)-(p.y-o.y)*(q.x-o.x);
  const d1=cr(c,d,a),d2=cr(c,d,b),d3=cr(a,b,c),d4=cr(a,b,d);
  return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}
let hover=null;

function roundRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function objById(id){ return P.objects.find(o=>o.id===id); }

draw = function(){
  if(!ctx) return;
  if(typeof updateDrawBar==="function") updateDrawBar();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,view.w,view.h);
  labelBoxes=[];

  // paper background fill (full viewport)
  ctx.fillStyle=getCSS("--paper");
  ctx.fillRect(0,0,view.w,view.h);

  drawGrid();

  // ordered draw: highlights first (under), then gutters, arrows, ds, valley, stamps, text on top
  const order={hl:0,gutter:1,arrow:2,ds:3,valley:4,stamp:5,text:6};
  const objs=[...P.objects].sort((a,b)=>(order[a.t]||9)-(order[b.t]||9));
  for(const o of objs) drawObject(o);

  // in-progress drawing
  drawInProgress();

  // highlight a snappable gutter end the cursor is near (shows a corner will form)
  if(tool==="gutter" && cursorW && !calib){
    const hit=findGutterEndNear(cursorW);
    if(hit){
      const sp=worldToScreen(hit.pt);
      ctx.save();
      ctx.strokeStyle="#16a34a";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(sp.x,sp.y,9,0,7);ctx.stroke();
      ctx.fillStyle="rgba(22,163,74,.18)";ctx.fill();
      ctx.restore();
    }
  }

  // calibration overlay
  if(calib && calib.a){    const a=worldToScreen(calib.a);
    const b=cursorW?worldToScreen(cursorW):a;
    ctx.save();
    ctx.strokeStyle="#c8202a";ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    [a,b].forEach(p=>{ctx.fillStyle="#fff";ctx.strokeStyle="#c8202a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.stroke();});
    ctx.restore();
  }

  // selection overlay
  drawSelection();
  updateSelActionBar();

  // marquee
  if(marquee){
    ctx.save();
    ctx.strokeStyle="#2b7fd0";ctx.fillStyle="rgba(43,127,208,.10)";ctx.lineWidth=1;
    const x=Math.min(marquee.x0,marquee.x1),y=Math.min(marquee.y0,marquee.y1);
    const w=Math.abs(marquee.x1-marquee.x0),h=Math.abs(marquee.y1-marquee.y0);
    ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);
    ctx.restore();
  }
};

function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* measurement/downspout label font size, world-anchored so it scales with zoom
   (keeps the PDF fit-to-view from cluttering) and tunable via settings.labelSize */
function chipPx(base){
  const s = base*(P.settings.labelSize||1)*cam.scale;
  return Math.max(2, Math.min(80, s));
}

function drawGrid(){
  const step=GRID*cam.scale;
  if(step<6) return;
  const ox=(-cam.x*cam.scale)%step;
  const oy=(-cam.y*cam.scale)%step;
  ctx.save();
  ctx.strokeStyle=getCSS("--grid");ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=ox;x<view.w;x+=step){ ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,view.h); }
  for(let y=oy;y<view.h;y+=step){ ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(view.w,Math.round(y)+.5); }
  ctx.stroke();
  // strong every 5
  const big=step*5;
  const bx=(-cam.x*cam.scale)%big, by=(-cam.y*cam.scale)%big;
  ctx.strokeStyle=getCSS("--grid-strong");ctx.beginPath();
  for(let x=bx;x<view.w;x+=big){ ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,view.h); }
  for(let y=by;y<view.h;y+=big){ ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(view.w,Math.round(y)+.5); }
  ctx.stroke();
  ctx.restore();
}

function addLabelBox(kind,objId,sx,sy,w,h,extra){
  labelBoxes.push(Object.assign({kind,objId,x:sx,y:sy,w,h},extra||{}));
}

function chip(text,sx,sy,opt){
  opt=opt||{};
  ctx.save();
  ctx.font=(opt.bold?"700 ":"600 ")+(opt.size||12)+"px "+(opt.font||"var(--mono)").replace("var(--mono)","ui-monospace,Consolas,monospace");
  const pad=opt.pad==null?5:opt.pad;
  const tw=ctx.measureText(text).width;
  const w=tw+pad*2, h=(opt.size||12)+pad*2;
  const x=sx-w/2, y=sy-h/2;
  roundRect(ctx,x,y,w,h,opt.r==null?5:opt.r);
  ctx.fillStyle=opt.bg||"#ffffff";
  ctx.fill();
  if(opt.border!==false){ ctx.lineWidth=opt.bw||1; ctx.strokeStyle=opt.bc||"#c2cbd4"; ctx.stroke(); }
  ctx.fillStyle=opt.fg||"#1b2530";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(text,sx,sy+.5);
  ctx.restore();
  return {x,y,w,h};
}

/* draw a chip at a base screen point but shifted by the object's saved label
   offset (world units), with a thin leader line back to the anchor when moved */
function labelOffsetOf(o,key){
  if(key==="note") return o.noteOff||null;
  return (o.segLabelOff && o.segLabelOff[key]) || null;
}
function segChip(o,key,mx,my,text,opt){
  const off=labelOffsetOf(o,key);
  const ox=off?(off.x||0):0, oy=off?(off.y||0):0;
  const lx=mx+ox*cam.scale, ly=my+oy*cam.scale;
  if(off && (Math.abs(ox)>1||Math.abs(oy)>1)){
    ctx.save();ctx.strokeStyle="rgba(60,72,88,.55)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(lx,ly);ctx.stroke();ctx.restore();
  }
  return chip(text,lx,ly,opt);
}

function drawObject(o){
  if(o.t==="gutter") return drawGutter(o);
  if(o.t==="custom") return drawCustom(o);
  if(o.t==="ds")     return drawDS(o);
  if(o.t==="valley") return drawValley(o);
  if(o.t==="text")   return drawText(o);
  if(o.t==="arrow")  return drawArrow(o);
  if(o.t==="stamp")  return drawStamp(o);
  if(o.t==="hl")     return drawHL(o);
}

function drawGutter(o){
  if(o.pts.length<1) return;
  const pts=o.pts.map(worldToScreen);
  const isSel=sel.has(o.id);
  const col=colorHex(o.color||P.settings.gutterColor);
  const w6 = gutterSizeFor(o)==="6K";
  // casing
  ctx.save();
  ctx.lineJoin="round";ctx.lineCap="round";
  ctx.strokeStyle="rgba(20,30,40,.55)";ctx.lineWidth=(w6?9:7);
  line(pts);
  ctx.strokeStyle=col;ctx.lineWidth=(w6?6:4.5);
  line(pts);
  if(isSel){ ctx.strokeStyle="#2b7fd0";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);line(pts);ctx.setLineDash([]); }
  ctx.restore();

  // end caps — only drawn at free (open) ends
  const caps=o.caps||[true,true];
  const fe=freeEnds(o);
  if(o.pts.length>=2){
    drawCapMark(pts[0],pts[1], fe[0] && caps[0]!==false);
    drawCapMark(pts[pts.length-1],pts[pts.length-2], fe[1] && caps[1]!==false);
  }
  // corner miter markers
  for(const c of runCorners(o)){
    const sp=worldToScreen(c.pt);
    ctx.save();
    if(c.bay){
      ctx.fillStyle=getCSS("--orange");ctx.strokeStyle="#fff";ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(sp.x,sp.y-7);ctx.lineTo(sp.x+7,sp.y);ctx.lineTo(sp.x,sp.y+7);ctx.lineTo(sp.x-7,sp.y);ctx.closePath();
      ctx.fill();ctx.stroke();
    }else{
      ctx.fillStyle="#33455a";ctx.strokeStyle="#fff";ctx.lineWidth=1.5;
      roundRect(ctx,sp.x-6,sp.y-6,12,12,2);ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }
  // segment length chips
  for(let i=0;i<o.pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ft=o.lengths[i];
    const txt=(ft==null||ft==="")?"+":(ftStr(ft));
    const empty=(ft==null||ft==="");
    const _sz=chipPx(12);
    const box=segChip(o,i,mx,my,txt,{size:_sz,pad:Math.max(2,_sz*0.42),bold:true,bg:empty?"#fff":"#1b2530",fg:empty?"#c8202a":"#fff",
      bc:empty?"#c8202a":"#1b2530",bw:empty?1.5:1});
    addLabelBox("seglen",o.id,box.x,box.y,box.w,box.h,{seg:i});
  }
}
function line(pts){ ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke(); }
function drawCapMark(end,prev,on){
  if(!on) return;
  const dx=end.x-prev.x,dy=end.y-prev.y,L=Math.hypot(dx,dy)||1;
  const nx=-dy/L,ny=dx/L; const r=6;
  ctx.save();ctx.strokeStyle="#1b2530";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(end.x+nx*r,end.y+ny*r);ctx.lineTo(end.x-nx*r,end.y-ny*r);ctx.stroke();ctx.restore();
}

function drawCustom(o){
  if(o.pts.length<1) return;
  const pts=o.pts.map(worldToScreen);
  const isSel=sel.has(o.id);
  const prod=(P.settings.customProducts||[]).find(x=>x.id===o.productId);
  const col=o.color||(prod&&prod.color)||"#7a4fd6";
  ctx.save();
  ctx.lineJoin="round";ctx.lineCap="round";
  ctx.strokeStyle="rgba(20,30,40,.45)";ctx.lineWidth=7;line(pts);
  ctx.strokeStyle=col;ctx.lineWidth=4.5;ctx.setLineDash([9,5]);line(pts);ctx.setLineDash([]);
  if(isSel){ ctx.strokeStyle="#2b7fd0";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);line(pts);ctx.setLineDash([]); }
  ctx.restore();
  // product tag at the first vertex
  if(prod){
    const p0=pts[0];
    const _pn=chipPx(10);
    chip(prod.name, p0.x, p0.y-14*cam.scale, {size:_pn,pad:Math.max(2,_pn*0.42),bold:true,bg:col,fg:"#fff",bc:col});
  }
  // segment length chips
  for(let i=0;i<o.pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ft=o.lengths[i];
    const empty=(ft==null||ft==="");
    const _csz=chipPx(12);
    const box=segChip(o,i,mx,my,empty?"+":ftStr(ft),{size:_csz,pad:Math.max(2,_csz*0.42),bold:true,bg:empty?"#fff":"#1b2530",fg:empty?"#c8202a":"#fff",bc:empty?"#c8202a":"#1b2530",bw:empty?1.5:1});
    addLabelBox("seglen",o.id,box.x,box.y,box.w,box.h,{seg:i});
  }
}

function drawDS(o){
  const s=worldToScreen(o);
  const col=colorHex(o.color||P.settings.downspoutColor);
  const sz=dsSizeFor(o);
  ctx.save();
  // outlet ring
  ctx.beginPath();ctx.arc(s.x,s.y,9,0,7);ctx.fillStyle="#fff";ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle="#1b2530";ctx.stroke();
  // downspout square (colored)
  roundRect(ctx,s.x-6,s.y-6,12,12,2.5);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#1b2530";ctx.stroke();
  if(sel.has(o.id)){ ctx.strokeStyle="#2b7fd0";ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,13,0,7);ctx.stroke(); }
  ctx.restore();
  // notation chip below
  const d=parseDS(o.notation);
  const label=(o.notation&&o.notation.trim())?o.notation.trim().toUpperCase():"(1 outlet)";
  const _dsz=chipPx(11);
  const box=segChip(o,"note",s.x,s.y+20*cam.scale,label,{size:_dsz,pad:Math.max(2,_dsz*0.42),bold:true,bg:"#fff",fg:"#1b2530",bc:"#7c8896"});
  addLabelBox("dsnote",o.id,box.x,box.y,box.w,box.h);
  // size tag
  const _stz=chipPx(9);
  chip(sz,s.x,s.y-20*cam.scale,{size:_stz,bold:true,bg:"#243240",fg:"#fff",bc:"#243240",pad:Math.max(2,_stz*0.42),r:4});
  addLabelBox("obj",o.id,s.x-9,s.y-9,18,18);
}

function drawValley(o){
  const s=worldToScreen(o);
  const _vsz=chipPx(13);
  const box=chip("VS",s.x,s.y,{size:_vsz,pad:Math.max(2,_vsz*0.42),bold:true,bg:getCSS("--orange"),fg:"#fff",bc:"#c96f00",bw:1.5,r:5});
  if(sel.has(o.id)){ ctx.save();ctx.strokeStyle="#2b7fd0";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(box.x-3,box.y-3,box.w+6,box.h+6);ctx.restore(); }
  addLabelBox("obj",o.id,box.x,box.y,box.w,box.h);
}

function textLines(o){
  const fontPx=(o.size||14);
  const prev=ctx.font;
  ctx.font=fontPx+"px "+(o.font||"Arial");
  const maxw=Math.max(12,(o.w||120)-16);
  const out=[];
  for(const raw of (o.text||"").split("\n")){
    const words=raw.split(" ");
    let cur="";
    for(const wd of words){
      const test=cur?cur+" "+wd:wd;
      if(ctx.measureText(test).width>maxw && cur){ out.push(cur); cur=wd; }
      else cur=test;
    }
    out.push(cur);
  }
  ctx.font=prev;
  return out;
}
function textHeight(o){
  const lh=(o.size||14)*1.3;
  const n=Math.max(1,textLines(o).length);
  return Math.round(n*lh + 14); // 7px padding top + bottom
}
function drawText(o){
  // height always conforms to the wrapped text; width is user-controlled
  o.h = textHeight(o);
  const lh=(o.size||14)*1.3;
  const s=worldToScreen(o);
  const w=o.w*cam.scale, h=o.h*cam.scale;
  ctx.save();
  roundRect(ctx,s.x,s.y,w,h,6);
  ctx.fillStyle=o.fill||"#ffffff";ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle= sel.has(o.id)?"#2b7fd0":(o.stroke||"#c2cbd4");ctx.stroke();
  ctx.fillStyle=o.color||"#1b2530";
  ctx.font=(o.size||14)*cam.scale+"px "+(o.font||"Arial");
  ctx.textBaseline="top";
  let yy=s.y+7*cam.scale;
  for(const ln of textLines(o)){ ctx.fillText(ln, s.x+8*cam.scale, yy); yy+=lh*cam.scale; }
  ctx.restore();
  addLabelBox("text",o.id,s.x,s.y,w,h);
}

function drawArrow(o){
  const a=worldToScreen({x:o.x1,y:o.y1}), b=worldToScreen({x:o.x2,y:o.y2});
  ctx.save();
  ctx.strokeStyle=o.color||"#c8202a";ctx.fillStyle=o.color||"#c8202a";
  ctx.lineWidth=(o.width||3)*Math.max(.6,cam.scale*0.8);ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  const ang=Math.atan2(b.y-a.y,b.x-a.x);const hs=9+(o.width||3);
  ctx.beginPath();ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x-hs*Math.cos(ang-.4),b.y-hs*Math.sin(ang-.4));
  ctx.lineTo(b.x-hs*Math.cos(ang+.4),b.y-hs*Math.sin(ang+.4));
  ctx.closePath();ctx.fill();
  if(sel.has(o.id)){ ctx.strokeStyle="#2b7fd0";ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    handle(a.x,a.y);handle(b.x,b.y); }
  ctx.restore();
}
function handle(x,y){ ctx.save();ctx.fillStyle="#fff";ctx.strokeStyle="#2b7fd0";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();ctx.stroke();ctx.restore(); }

function drawStamp(o){
  const s=worldToScreen(o);
  const fontPx=chipPx(13), k=fontPx/13;
  ctx.save();
  ctx.font="700 "+fontPx+"px "+(o.font||"Arial");
  const tw=ctx.measureText(o.text||"STAMP").width;
  const w=tw+24*k, h=26*k, x=s.x-w/2, y=s.y-h/2, notch=9*k;
  // tag shape
  ctx.beginPath();
  ctx.moveTo(x+notch,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x+notch,y+h);
  ctx.lineTo(x,y+h/2);ctx.closePath();
  ctx.fillStyle=o.color||"#c8202a";ctx.fill();
  ctx.beginPath();ctx.arc(x+8*k,y+h/2,2.4*k,0,7);ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(o.text||"STAMP",x+notch+(w-notch)/2,y+h/2+.5);
  if(sel.has(o.id)){ ctx.strokeStyle="#2b7fd0";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(x-2,y-2,w+4,h+4);ctx.setLineDash([]); }
  ctx.restore();
  addLabelBox("stamp",o.id,x,y,w,h);
}

function drawHL(o){
  if(o.pts.length<1) return;
  const pts=o.pts.map(worldToScreen);
  ctx.save();
  ctx.globalAlpha=.42;ctx.strokeStyle=o.color||getCSS("--hl");
  ctx.lineWidth=(o.width||16)*Math.max(.5,cam.scale);ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  if(pts.length===1)ctx.lineTo(pts[0].x+.1,pts[0].y);
  ctx.stroke();
  ctx.restore();
  if(sel.has(o.id)){ const b=objBounds(o);const tl=worldToScreen({x:b.x,y:b.y});
    ctx.save();ctx.strokeStyle="#2b7fd0";ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.strokeRect(tl.x,tl.y,b.w*cam.scale,b.h*cam.scale);ctx.restore(); }
}

function drawInProgress(){
  if(!drawing) return;
  ctx.save();
  if(drawing.t==="gutter"){
    const pts=drawing.pts.map(worldToScreen);
    if(cursorW){ pts.push(worldToScreen(cursorW)); }
    ctx.strokeStyle="rgba(20,30,40,.4)";ctx.lineWidth=8;ctx.lineJoin="round";ctx.lineCap="round";
    if(pts.length>1) line(pts);
    ctx.strokeStyle=colorHex(P.settings.gutterColor);ctx.lineWidth=5;
    if(pts.length>1) line(pts);
    for(const p of drawing.pts.map(worldToScreen)){ ctx.fillStyle="#fff";ctx.strokeStyle="#1b2530";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.stroke(); }
    // live measurement of the segment being drawn
    if(P.settings.autoMeasure && cursorW && drawing.pts.length>=1){
      const last=drawing.pts[drawing.pts.length-1];
      const a=worldToScreen(last), b=worldToScreen(cursorW);
      const ft=autoLen(last,cursorW);
      if(ft>0){
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        ctx.restore(); chip(ftStr(ft),mx,my,{size:chipPx(12),pad:Math.max(2,chipPx(12)*0.42),bold:true,bg:"#1b2530",fg:"#fff",bc:"#1b2530"}); ctx.save();
      }
    }
  } else if(drawing.t==="custom"){
    const prod=(P.settings.customProducts||[]).find(x=>x.id===activeCustom);
    const col=(prod&&prod.color)||"#7a4fd6";
    const pts=drawing.pts.map(worldToScreen);
    if(cursorW){ pts.push(worldToScreen(cursorW)); }
    ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineJoin="round";ctx.lineCap="round";ctx.setLineDash([9,5]);
    if(pts.length>1) line(pts); ctx.setLineDash([]);
    for(const p of drawing.pts.map(worldToScreen)){ ctx.fillStyle="#fff";ctx.strokeStyle="#1b2530";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.stroke(); }
    if(P.settings.autoMeasure && cursorW && drawing.pts.length>=1){
      const last=drawing.pts[drawing.pts.length-1];
      const a=worldToScreen(last), b=worldToScreen(cursorW);
      const ft=autoLen(last,cursorW);
      if(ft>0){ const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; ctx.restore(); chip(ftStr(ft),mx,my,{size:chipPx(12),pad:Math.max(2,chipPx(12)*0.42),bold:true,bg:"#1b2530",fg:"#fff",bc:"#1b2530"}); ctx.save(); }
    }
  } else if(drawing.t==="arrow"&&cursorW){
    const a=worldToScreen(drawing.start),b=worldToScreen(cursorW);
    ctx.strokeStyle="#c8202a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  } else if(drawing.t==="hl"){
    const pts=drawing.pts.map(worldToScreen);
    ctx.globalAlpha=.42;ctx.strokeStyle=hlColor;ctx.lineWidth=(hlWidth)*Math.max(.5,cam.scale);ctx.lineCap="round";ctx.lineJoin="round";
    if(pts.length){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
  } else if(drawing.t==="text"&&cursorW){
    const a=worldToScreen(drawing.start),b=worldToScreen(cursorW);
    ctx.strokeStyle="#2b7fd0";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
    ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawSelection(){
  // highlight every selected segment (red dashed)
  if(segSel.size){
    ctx.save();
    ctx.strokeStyle="#e01b24";ctx.lineWidth=5;ctx.setLineDash([8,5]);ctx.lineCap="round";
    segSel.forEach(k=>{
      const {objId,seg}=parseSegKey(k); const o=objById(objId);
      if(o&&o.pts&&seg<o.pts.length-1){
        const a=worldToScreen(o.pts[seg]), b=worldToScreen(o.pts[seg+1]);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
    });
    ctx.restore();
  }
  // corner dots when exactly one run is active
  const ids=activeRunIds();
  if(ids.size===1){
    const o=objById([...ids][0]);
    if(o&&o.pts&&(o.t==="gutter"||o.t==="custom")){
      ctx.save();
      for(const p of o.pts){
        const s=worldToScreen(p);
        ctx.beginPath();ctx.arc(s.x,s.y,5.5,0,7);
        ctx.fillStyle="#fff";ctx.strokeStyle="#2b7fd0";ctx.lineWidth=2;ctx.fill();ctx.stroke();
      }
      ctx.restore();
    }
  }
}

/* object bounds in WORLD coords {x,y,w,h} */
function objBounds(o){
  if(o.t==="gutter"||o.t==="hl"||o.t==="custom"){
    const xs=o.pts.map(p=>p.x),ys=o.pts.map(p=>p.y);
    const x=Math.min(...xs),y=Math.min(...ys);
    return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};
  }
  if(o.t==="arrow"){ const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2);return {x,y,w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)};}
  if(o.t==="text"){ return {x:o.x,y:o.y,w:o.w,h:o.h}; }
  if(o.t==="ds"||o.t==="valley"||o.t==="stamp"){ return {x:o.x-30,y:o.y-20,w:60,h:50}; }
  return {x:o.x||0,y:o.y||0,w:20,h:20};
}
